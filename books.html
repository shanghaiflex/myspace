<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Книги</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --surface: #ffffff; --surface-2: #f2f2f4;
    --text: #1d1d1f; --text-2: #6e6e73; --text-3: #a1a1a6;
    --line: rgba(0,0,0,.08); --accent: #0071e3; --star: #f5a623;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
    --shadow-lg: 0 2px 8px rgba(0,0,0,.08), 0 24px 64px rgba(0,0,0,.18);
    --glass: rgba(250,250,250,.78); --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --surface: #1c1c1e; --surface-2: #2c2c2e;
      --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #6e6e73;
      --line: rgba(255,255,255,.1); --accent: #2997ff;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
      --shadow-lg: 0 2px 8px rgba(0,0,0,.5), 0 24px 64px rgba(0,0,0,.6);
      --glass: rgba(0,0,0,.72);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Inter, system-ui, sans-serif;
    background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.45; letter-spacing: -0.01em; }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  .bar { position: sticky; top: 0; z-index: 20; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
  .bar-inner { max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .nav { display: flex; gap: 18px; font-size: 17px; letter-spacing: -0.02em; margin-right: 4px; }
  .nav a { color: var(--text-3); font-weight: 600; }
  .nav a.on { color: var(--text); }
  .segmented { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
  .segmented button { border: 0; background: transparent; border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 500; color: var(--text-2); white-space: nowrap; transition: background .18s ease, color .18s ease; }
  .segmented button .n { color: var(--text-3); margin-left: 5px; font-variant-numeric: tabular-nums; }
  .segmented button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .spacer { flex: 1; }
  .search { position: relative; min-width: 220px; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-3); pointer-events: none; }
  .search input { width: 100%; border: 0; outline: 0; background: var(--surface-2); border-radius: 10px; padding: 7px 12px 7px 32px; font-size: 14px; }
  .search input:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .search input::placeholder { color: var(--text-3); }
  .control { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 10px; padding: 0 6px 0 12px; height: 34px; font-size: 13px; color: var(--text-2); }
  .control select { border: 0; background: transparent; outline: 0; color: var(--text); font-weight: 500; padding: 6px 4px; -webkit-appearance: none; appearance: none; cursor: pointer; }
  .control .dir { border: 0; background: transparent; width: 28px; height: 28px; border-radius: 7px; display: inline-grid; place-items: center; color: var(--text-2); }
  .control .dir svg { width: 14px; height: 14px; transition: transform .2s ease; }
  .control .dir.asc svg { transform: rotate(180deg); }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 36px 32px 80px; }
  .head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
  .head h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; margin: 0; line-height: 1.1; }
  .head .meta { color: var(--text-2); font-size: 15px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 28px 20px; }
  .card { display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
  .cover { position: relative; aspect-ratio: 2 / 3; border-radius: var(--radius); overflow: hidden; background: var(--surface-2); box-shadow: var(--shadow);
    transition: transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s ease; display: grid; place-items: center; }
  .card:hover .cover { transform: translateY(-4px) scale(1.015); box-shadow: var(--shadow-lg); }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .ph { padding: 14px; text-align: center; color: var(--text-2); font-size: 13px; font-weight: 600; line-height: 1.3; }
  .badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.55); color: #fff; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .badge svg { width: 10px; height: 10px; color: var(--star); }
  .card .t { font-size: 14px; font-weight: 600; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .card .alt { font-size: 12.5px; color: var(--text-3); line-height: 1.3; margin-top: 1px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
  .card .s { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
  .empty { color: var(--text-2); text-align: center; padding: 80px 0; }

  .scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.4); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity .22s ease; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet { width: 100%; max-width: 820px; max-height: min(88vh, 900px); background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-lg);
    display: grid; grid-template-columns: 280px 1fr; overflow: hidden; transform: translateY(14px) scale(.98); transition: transform .25s cubic-bezier(.2,.7,.2,1); }
  .scrim.open .sheet { transform: none; }
  .sheet .left { background: var(--surface-2); display: grid; place-items: center; }
  .sheet .left img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sheet .right { padding: 32px 36px; overflow: auto; position: relative; }
  .sheet h2 { margin: 0 0 4px; font-size: 24px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; padding-right: 40px; }
  .sheet .alt { color: var(--text-3); font-size: 15px; line-height: 1.25; margin: 0 0 6px; padding-right: 40px; }
  .sheet .sub { color: var(--text-2); font-size: 14px; margin-bottom: 18px; }
  .sheet .segmented { margin-bottom: 18px; }
  .sheet .segmented button { padding: 5px 11px; font-size: 12.5px; }
  .score { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; margin-bottom: 18px; }
  .score .l { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 600; }
  .score .v { font-size: 24px; font-weight: 700; letter-spacing: -0.03em; display: flex; align-items: baseline; gap: 10px; }
  .score .v small { font-size: 13px; color: var(--text-3); font-weight: 500; }
  .score .clear { border: 0; background: transparent; color: var(--text-3); font-size: 12px; padding: 0; }
  .stars { display: inline-flex; gap: 2px; margin-top: 4px; }
  .stars .st { position: relative; width: 22px; height: 22px; cursor: pointer; }
  .stars .st svg { position: absolute; inset: 0; width: 22px; height: 22px; color: var(--line); }
  .stars .st .fill { position: absolute; inset: 0; clip-path: inset(0 100% 0 0); }
  .stars .st .fill svg { color: var(--star); }
  .stars .st.full .fill { clip-path: inset(0 0 0 0); }
  .stars .st.half .fill { clip-path: inset(0 50% 0 0); }
  .stars .st .l, .stars .st .r { position: absolute; top: 0; bottom: 0; width: 50%; }
  .stars .st .l { left: 0; } .stars .st .r { right: 0; }
  .sheet p { margin: 0 0 16px; font-size: 14.5px; line-height: 1.55; }
  .sheet textarea { width: 100%; border: 0; outline: 0; resize: vertical; min-height: 44px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 16px; }
  .sheet textarea:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .sheet .foot { display: flex; gap: 14px; align-items: center; font-size: 13px; color: var(--text-3); flex-wrap: wrap; }
  .sheet .foot .del { margin-left: auto; border: 0; background: transparent; color: #ff3b30; font-weight: 500; }
  .close { position: absolute; top: 18px; right: 18px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--text-2); display: grid; place-items: center; }
  .close svg { width: 12px; height: 12px; }
  .saved { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); opacity: 0; z-index: 60; background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 500; transition: all .2s ease; pointer-events: none; }
  .saved.on { opacity: 1; transform: translate(-50%, 0); }
  .hint { margin-top: 56px; text-align: center; color: var(--text-3); font-size: 12.5px; }
  .hint code { font-family: ui-monospace, SF Mono, Menlo, monospace; }
  @media (max-width: 680px) {
    .bar-inner { padding: 12px 16px; gap: 10px; } .nav { font-size: 15px; gap: 14px; }
    .wrap { padding: 24px 16px 60px; } .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 20px 12px; } .head h1 { font-size: 28px; }
    .scrim { padding: 0; align-items: end; } .sheet { grid-template-columns: 1fr; border-radius: 22px 22px 0 0; max-height: 92vh; overflow: auto; display: block; }
    .sheet .left { height: 40vh; } .sheet .right { padding: 22px 20px 36px; overflow: visible; }
  }
</style>
</head>
<body>
<header class="bar"><div class="bar-inner">
  <nav class="nav"><a href="index.html">Главная</a><a href="films.html">Фильмы</a><a href="books.html" class="on">Книги</a><a href="mixes.html">Миксы</a><a href="lectures.html">Лекции</a><a href="health.html">Самочувствие</a></nav>
  <div class="segmented" id="tabs">
    <button data-tab="read">Прочитал<span class="n"></span></button>
    <button data-tab="reading">Читаю<span class="n"></span></button>
    <button data-tab="to-read">Хочу прочитать<span class="n"></span></button>
    <button data-tab="abandoned">Не дочитал<span class="n"></span></button>
  </div>
  <div class="spacer"></div>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Название, автор" autocomplete="off"></label>
  <div class="control"><span>Сортировка</span><select id="sort"><option value="added">добавлено</option><option value="rating">оценка</option><option value="title">название</option><option value="author">автор</option><option value="year">год</option></select>
    <button class="dir" id="dir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button></div>
</div></header>

<main class="wrap">
  <div class="head"><h1 id="title">Прочитал</h1><div class="meta" id="meta"></div></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Ничего не найдено</div>
  <div class="hint">Добавить книгу: попроси Claude Code — <code>scripts/books.py add "Название" --author "Автор"</code></div>
</main>
<div class="saved" id="saved">Сохранено</div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
const STATUS_LABEL = { read: 'Прочитал', reading: 'Читаю', 'to-read': 'Хочу прочитать', abandoned: 'Не дочитал' };
const state = { tab: 'read', q: '', sort: 'added', dir: 'desc', books: [] };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => n == null ? '—' : (Number.isInteger(n) ? String(n) : n.toFixed(1));
const STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 6.6 7 .8-5.2 4.9 1.4 7.1L12 17.8 5.8 21.4l1.4-7.1L2 9.4l7-.8z"/></svg>';
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return n + ' ' + (m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c); };
let canEdit = false, toastTimer, queue = Promise.resolve();
function toast(t) { const el = $('#saved'); el.textContent = t; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 1400); }
function persist() { try { localStorage.setItem('books.ui', JSON.stringify({ tab: state.tab, sort: state.sort, dir: state.dir })); } catch {} }
function restore() { try { const s = JSON.parse(localStorage.getItem('books.ui') || '{}'); if (STATUS_LABEL[s.tab]) state.tab = s.tab; if (s.sort) state.sort = s.sort; if (s.dir) state.dir = s.dir; } catch {} }

function visible() {
  const q = state.q.trim().toLowerCase();
  let list = state.books.filter(b => b.status === state.tab);
  if (q) list = state.books.filter(b => [b.title, b.titleAlt, b.author].some(v => (v || '').toLowerCase().includes(q)));
  const key = { added: b => b.addedAt || '', rating: b => b.rating ?? -1, title: b => (b.title || '').toLowerCase(), author: b => (b.author || '').toLowerCase(), year: b => b.year || 0 }[state.sort];
  const sign = state.dir === 'desc' ? -1 : 1;
  list.sort((a, b) => { const x = key(a), y = key(b); return x < y ? -sign : x > y ? sign : (a.title || '').localeCompare(b.title || ''); });
  return list;
}
function render() {
  document.querySelectorAll('#tabs button').forEach(b => { b.classList.toggle('on', b.dataset.tab === state.tab); b.querySelector('.n').textContent = state.books.filter(x => x.status === b.dataset.tab).length || ''; });
  $('#sort').value = state.sort; $('#dir').classList.toggle('asc', state.dir === 'asc');
  $('#title').textContent = STATUS_LABEL[state.tab];
  const list = visible();
  $('#meta').textContent = plural(list.length, 'книга', 'книги', 'книг');
  $('#empty').hidden = list.length > 0;
  $('#grid').innerHTML = list.map(b => `
    <article class="card" data-id="${esc(b.id)}">
      <div class="cover">${b.cover ? `<img src="${esc(b.cover)}" alt="" loading="lazy">` : `<div class="ph">${esc(b.title)}</div>`}
        ${b.rating != null ? `<span class="badge">${STAR}${fmt(b.rating)}</span>` : ''}</div>
      <div><div class="t">${esc(b.title)}</div>${b.titleAlt ? `<div class="alt">${esc(b.titleAlt)}</div>` : ''}<div class="s">${esc(b.author || '')}${b.year ? ' · ' + b.year : ''}</div></div>
    </article>`).join('');
}
async function api(method, id, body) {
  const r = await fetch('/api/book/' + encodeURIComponent(id), { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return r.json();
}
function update(b, patch) {
  queue = queue.then(async () => { try { Object.assign(b, await api('PATCH', b.id, patch)); render(); openSheet(b, true); toast('Сохранено'); } catch (e) { toast('Ошибка: ' + e.message); } });
  return queue;
}
function starsHtml(r) {
  return `<div class="stars">${Array.from({ length: 10 }, (_, i) => { const n = i + 1, cls = r >= n ? 'full' : r >= n - .5 ? 'half' : '';
    return `<span class="st ${cls}" data-n="${n}">${STAR}<span class="fill">${STAR}</span><span class="l" data-v="${n - .5}"></span><span class="r" data-v="${n}"></span></span>`; }).join('')}</div>`;
}
function paintStars(root, v) { root.querySelectorAll('.stars .st').forEach(st => { const n = +st.dataset.n; st.classList.toggle('full', v >= n); st.classList.toggle('half', v < n && v >= n - .5); }); }
function openSheet(b, keep) {
  const sheet = $('#sheet');
  sheet.innerHTML = `
    <div class="left">${b.cover ? `<img src="${esc(b.cover)}" alt="">` : '<div class="ph">📚</div>'}</div>
    <div class="right">
      <button class="close" id="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h2>${esc(b.title)}</h2>
      ${b.titleAlt ? `<div class="alt">${esc(b.titleAlt)}</div>` : ''}
      <div class="sub">${[b.author, b.year, b.pages && b.pages + ' стр.'].filter(Boolean).map(esc).join(' · ')}</div>
      ${canEdit ? `<div class="segmented" id="statusCtl">${Object.entries(STATUS_LABEL).map(([k, v]) => `<button data-status="${k}" class="${k === b.status ? 'on' : ''}">${v}</button>`).join('')}</div>` : `<div class="sub">${STATUS_LABEL[b.status]}</div>`}
      <div class="score"><div class="l">Моя оценка</div><div class="v">${fmt(b.rating)}<small>/ 10</small>${canEdit && b.rating != null ? '<button class="clear" data-act="clear">убрать</button>' : ''}</div>${canEdit ? starsHtml(b.rating ?? 0) : ''}</div>
      ${b.description ? `<p>${esc(b.description)}</p>` : ''}
      ${canEdit ? `<textarea id="commentCtl" placeholder="Заметка" rows="2">${esc(b.comment || '')}</textarea>` : (b.comment ? `<p>${esc(b.comment)}</p>` : '')}
      <div class="foot">${b.isbn ? `<a href="https://www.goodreads.com/search?q=${esc(b.isbn)}" target="_blank" rel="noopener" style="color:var(--accent)">Goodreads ↗</a>` : ''}
        <span>${[b.finishedAt && 'прочитано ' + b.finishedAt, b.addedAt && 'добавлена ' + b.addedAt].filter(Boolean).join(' · ')}</span>
        ${canEdit ? '<button class="del" id="delCtl">Удалить</button>' : ''}</div>
    </div>`;
  if (!keep) $('#scrim').classList.add('open');
  $('#close').onclick = closeSheet;
  history.replaceState(null, '', '#' + encodeURIComponent(b.id));
  if (!canEdit) return;
  sheet.querySelectorAll('.stars .l, .stars .r').forEach(el => { el.addEventListener('mouseenter', () => paintStars(sheet, +el.dataset.v)); el.addEventListener('click', () => update(b, { rating: +el.dataset.v })); });
  sheet.querySelector('.stars')?.addEventListener('mouseleave', () => paintStars(sheet, b.rating ?? 0));
  sheet.querySelector('[data-act=clear]')?.addEventListener('click', () => update(b, { rating: null }));
  sheet.querySelectorAll('#statusCtl button').forEach(x => x.addEventListener('click', () => { if (x.dataset.status !== b.status) update(b, { status: x.dataset.status }); }));
  const c = $('#commentCtl'); c.addEventListener('blur', () => { if ((c.value.trim() || null) !== (b.comment || null)) update(b, { comment: c.value }); });
  const del = $('#delCtl');
  del.addEventListener('click', async () => {
    if (del.dataset.armed !== '1') { del.dataset.armed = '1'; del.textContent = 'Точно удалить?'; setTimeout(() => { del.dataset.armed = ''; del.textContent = 'Удалить'; }, 3000); return; }
    try { await api('DELETE', b.id); state.books = state.books.filter(x => x.id !== b.id); closeSheet(); render(); toast('Удалено: ' + b.title); } catch (e) { toast('Ошибка: ' + e.message); }
  });
}
function closeSheet() { $('#scrim').classList.remove('open'); if (location.hash) history.replaceState(null, '', location.pathname); }
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.tab = b.dataset.tab; persist(); render(); });
$('#q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('#sort').addEventListener('change', e => { state.sort = e.target.value; persist(); render(); });
$('#dir').addEventListener('click', () => { state.dir = state.dir === 'desc' ? 'asc' : 'desc'; persist(); render(); });
$('#grid').addEventListener('click', e => { const c = e.target.closest('.card'); if (!c) return; const b = state.books.find(x => x.id === c.dataset.id); if (b) openSheet(b); });
$('#scrim').addEventListener('click', e => { if (e.target === e.currentTarget) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); } });
restore();
fetch('/api/ping', { cache: 'no-store' }).then(r => r.ok && r.json()).then(j => { canEdit = !!(j && j.ok); }).catch(() => {});
fetch('books.json', { cache: 'no-store' }).then(r => r.json()).then(list => {
  state.books = list; render();
  const h = decodeURIComponent(location.hash.slice(1));
  if (STATUS_LABEL[h]) { state.tab = h; persist(); render(); history.replaceState(null, '', location.pathname); }
  else { const b = h && list.find(x => x.id === h); if (b) { state.tab = b.status; render(); openSheet(b); } }
}).catch(() => { $('.wrap').innerHTML = '<div class="empty">Не удалось загрузить books.json, запусти ./serve.sh</div>'; });
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Читать</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --surface: #ffffff; --surface-2: #f2f2f4;
    --text: #1d1d1f; --text-2: #6e6e73; --text-3: #a1a1a6;
    --line: rgba(0,0,0,.08); --accent: #0071e3; --star: #f5a623;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
    --shadow-lg: 0 2px 8px rgba(0,0,0,.08), 0 24px 64px rgba(0,0,0,.18);
    --glass: rgba(250,250,250,.78); --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --surface: #1c1c1e; --surface-2: #2c2c2e;
      --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #6e6e73;
      --line: rgba(255,255,255,.1); --accent: #2997ff;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
      --shadow-lg: 0 2px 8px rgba(0,0,0,.5), 0 24px 64px rgba(0,0,0,.6);
      --glass: rgba(0,0,0,.72);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Inter, system-ui, sans-serif;
    background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.45; letter-spacing: -0.01em; }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  .bar { position: sticky; top: 0; z-index: 20; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
  .bar-inner { max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .nav { display: flex; gap: 18px; font-size: 17px; letter-spacing: -0.02em; margin-right: 4px; }
  .nav a { color: var(--text-3); font-weight: 600; }
  .nav a.on { color: var(--text); }
  .segmented { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
  .segmented button { border: 0; background: transparent; border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 500; color: var(--text-2); white-space: nowrap; transition: background .18s ease, color .18s ease; }
  .segmented button .n { color: var(--text-3); margin-left: 5px; font-variant-numeric: tabular-nums; }
  .segmented button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .spacer { flex: 1; }
  .search { position: relative; min-width: 220px; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-3); pointer-events: none; }
  .search input { width: 100%; border: 0; outline: 0; background: var(--surface-2); border-radius: 10px; padding: 7px 12px 7px 32px; font-size: 14px; }
  .search input:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .search input::placeholder { color: var(--text-3); }
  .control { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 10px; padding: 0 6px 0 12px; height: 34px; font-size: 13px; color: var(--text-2); }
  .control select { border: 0; background: transparent; outline: 0; color: var(--text); font-weight: 500; padding: 6px 4px; -webkit-appearance: none; appearance: none; cursor: pointer; }
  .control .dir { border: 0; background: transparent; width: 28px; height: 28px; border-radius: 7px; display: inline-grid; place-items: center; color: var(--text-2); }
  .control .dir svg { width: 14px; height: 14px; transition: transform .2s ease; }
  .control .dir.asc svg { transform: rotate(180deg); }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 36px 32px 80px; }
  .head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
  .head h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; margin: 0; line-height: 1.1; }
  .head .meta { color: var(--text-2); font-size: 15px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 28px 20px; }
  .card { display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
  .cover { position: relative; aspect-ratio: 2 / 3; border-radius: var(--radius); overflow: hidden; background: var(--surface-2); box-shadow: var(--shadow);
    transition: transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s ease; display: grid; place-items: center; }
  .card:hover .cover { transform: translateY(-4px) scale(1.015); box-shadow: var(--shadow-lg); }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .ph { padding: 14px; text-align: center; color: var(--text-2); font-size: 13px; font-weight: 600; line-height: 1.3; }
  .badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.55); color: #fff; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .badge svg { width: 10px; height: 10px; color: var(--star); }
  .card .t { font-size: 14px; font-weight: 600; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .card .alt { font-size: 12.5px; color: var(--text-3); line-height: 1.3; margin-top: 1px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
  .card .s { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
  .empty { color: var(--text-2); text-align: center; padding: 80px 0; }

  .scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.4); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity .22s ease; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet { width: 100%; max-width: 820px; max-height: min(88vh, 900px); background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-lg);
    display: grid; grid-template-columns: 280px 1fr; overflow: hidden; transform: translateY(14px) scale(.98); transition: transform .25s cubic-bezier(.2,.7,.2,1); }
  .scrim.open .sheet { transform: none; }
  .sheet .left { background: var(--surface-2); display: grid; place-items: center; }
  .sheet .left img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sheet .right { padding: 32px 36px; overflow: auto; position: relative; }
  .sheet h2 { margin: 0 0 4px; font-size: 24px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; padding-right: 40px; }
  .sheet .alt { color: var(--text-3); font-size: 15px; line-height: 1.25; margin: 0 0 6px; padding-right: 40px; }
  .sheet .sub { color: var(--text-2); font-size: 14px; margin-bottom: 18px; }
  .sheet .segmented { margin-bottom: 18px; }
  .sheet .segmented button { padding: 5px 11px; font-size: 12.5px; }
  .score { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; margin-bottom: 18px; }
  .score .l { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 600; }
  .score .v { font-size: 24px; font-weight: 700; letter-spacing: -0.03em; display: flex; align-items: baseline; gap: 10px; }
  .score .v small { font-size: 13px; color: var(--text-3); font-weight: 500; }
  .score .clear { border: 0; background: transparent; color: var(--text-3); font-size: 12px; padding: 0; }
  .stars { display: inline-flex; gap: 2px; margin-top: 4px; }
  .stars .st { position: relative; width: 22px; height: 22px; cursor: pointer; }
  .stars .st svg { position: absolute; inset: 0; width: 22px; height: 22px; color: var(--line); }
  .stars .st .fill { position: absolute; inset: 0; clip-path: inset(0 100% 0 0); }
  .stars .st .fill svg { color: var(--star); }
  .stars .st.full .fill { clip-path: inset(0 0 0 0); }
  .stars .st.half .fill { clip-path: inset(0 50% 0 0); }
  .stars .st .l, .stars .st .r { position: absolute; top: 0; bottom: 0; width: 50%; }
  .stars .st .l { left: 0; } .stars .st .r { right: 0; }
  .sheet p { margin: 0 0 16px; font-size: 14.5px; line-height: 1.55; }
  .sheet textarea { width: 100%; border: 0; outline: 0; resize: vertical; min-height: 44px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 16px; }
  .sheet textarea:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .sheet .foot { display: flex; gap: 14px; align-items: center; font-size: 13px; color: var(--text-3); flex-wrap: wrap; }
  .sheet .foot .del { margin-left: auto; border: 0; background: transparent; color: #ff3b30; font-weight: 500; }
  .close { position: absolute; top: 18px; right: 18px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--text-2); display: grid; place-items: center; }
  .close svg { width: 12px; height: 12px; }
  .saved { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); opacity: 0; z-index: 60; background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 500; transition: all .2s ease; pointer-events: none; }
  .saved.on { opacity: 1; transform: translate(-50%, 0); }
  .hint { margin-top: 56px; text-align: center; color: var(--text-3); font-size: 12.5px; }
  .hint code { font-family: ui-monospace, SF Mono, Menlo, monospace; }
  @media (max-width: 680px) {
    .bar-inner { padding: 12px 16px; gap: 10px; } .nav { font-size: 15px; gap: 14px; }
    .wrap { padding: 24px 16px 60px; } .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 20px 12px; } .head h1 { font-size: 28px; }
    .scrim { padding: 0; align-items: end; } .sheet { grid-template-columns: 1fr; border-radius: 22px 22px 0 0; max-height: 92vh; overflow: auto; display: block; }
    .sheet .left { height: 40vh; } .sheet .right { padding: 22px 20px 36px; overflow: visible; }
  }

  /* Советы Claude (taste.js) */
  .recs { margin: 0 0 40px; }
  .rechead { display: flex; align-items: baseline; gap: 12px; margin: 0 0 14px; }
  .rechead h2 { font-size: 19px; font-weight: 650; letter-spacing: -0.02em; margin: 0; }
  .rechead .meta { color: var(--text-3); font-size: 12.5px; }
  .rechead .spacer { flex: 1; }
  .rechead button { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; padding: 4px 2px; }
  .rechead button:disabled { color: var(--text-3); cursor: default; }
  .recgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .rec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); transition: opacity .18s, transform .18s; }
  .rec.gone { opacity: 0; transform: scale(.97); pointer-events: none; }
  .rec .top { display: flex; gap: 12px; }
  .rec .cv { width: 56px; flex: 0 0 56px; aspect-ratio: 2/3; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
  .rec .cv img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rec .t { font-size: 14.5px; font-weight: 600; line-height: 1.3; }
  .rec .t .y { color: var(--text-3); font-weight: 400; }
  .rec .s { font-size: 12.5px; color: var(--text-2); margin-top: 3px; }
  .rec .warn { color: var(--text-3); }
  .rec .why { font-size: 13px; line-height: 1.45; color: var(--text-2); }
  .rec .acts { display: flex; gap: 8px; margin-top: auto; }
  .rec .acts button { flex: 1; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .rec .acts .take { background: var(--accent); border-color: transparent; color: #fff; }
  @media (max-width: 560px) { .recgrid { grid-template-columns: 1fr; } }
/* Phone: the nav wraps onto a second row instead of pushing the page sideways (the sticky bar ended at «Еда»
   and the whole page scrolled horizontally in the BoW app). */
@media (max-width: 760px) {
  html, body { overflow-x: hidden; }
  .bar-inner { flex-wrap: wrap; }
  .nav { flex-wrap: wrap; gap: 6px 14px; font-size: 15px; }
}
</style>
<style>
  .sec { margin: 0 0 44px; }
  .sechead { display: flex; align-items: baseline; gap: 12px; margin: 0 0 14px; }
  .sechead h2 { font-size: 19px; font-weight: 650; letter-spacing: -0.02em; margin: 0; }
  .sechead .meta { color: var(--text-3); font-size: 12.5px; }
  .sechead .spacer { flex: 1; }
  .sechead button { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; padding: 4px 2px; }
  .sechead button:disabled { color: var(--text-3); cursor: default; }
  .arts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .art { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
    transition: opacity .18s, transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s ease; }
  .art:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .art.gone { opacity: 0; transform: scale(.98); pointer-events: none; }
  .art .pic { display: block; aspect-ratio: 16 / 10; background: var(--surface-2); overflow: hidden; position: relative; }
  .art .pic img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
  .art:hover .pic img { transform: scale(1.03); }
  .art .pic .ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; color: var(--text-3); font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, var(--surface-2)), var(--surface-2) 70%); }
  .art .body { padding: 14px 18px 16px; display: flex; flex-direction: column; flex: 1; }
  .art .src { font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
  .art h3 { margin: 5px 0 0; font-size: 17px; font-weight: 620; line-height: 1.28; letter-spacing: -0.01em; }
  .art h3 a { color: var(--text); }
  .art h3 a:hover { color: var(--accent); }
  .art .why { margin: 8px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--text-2); }
  .art .acts { display: flex; gap: 8px; margin-top: 14px; padding-top: 2px; }
  .art .acts button { border: 1px solid var(--line); background: var(--surface-2); color: var(--text); border-radius: 8px; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .art .acts .take { background: var(--accent); border-color: transparent; color: #fff; }
  /* список чтения — компактные строки с миниатюрой */
  .arts.rows { grid-template-columns: 1fr; gap: 10px; }
  .arts.rows .art { flex-direction: row; align-items: stretch; }
  .arts.rows .art:hover { transform: none; box-shadow: var(--shadow); }
  .arts.rows .pic { width: 168px; flex: 0 0 168px; aspect-ratio: auto; min-height: 96px; }
  .arts.rows .body { padding: 12px 16px; }
  .arts.rows h3 { font-size: 15.5px; }
  .arts.rows .why { display: none; }
  .arts.rows .acts { margin-top: auto; padding-top: 10px; }
  @media (max-width: 560px) { .arts { grid-template-columns: 1fr; } .arts.rows .pic { width: 112px; flex-basis: 112px; } }
  .empty { color: var(--text-3); font-size: 13.5px; }
  .done li { font-size: 13.5px; color: var(--text-2); margin: 6px 0; }
  .done a { color: var(--text-2); }
</style>

<body>
<header class="bar"><div class="bar-inner">
  <nav class="nav"><a href="index.html">Главная</a><a href="films.html">Фильмы</a><a href="books.html">Книги</a><a href="mixes.html">Миксы</a><a href="lectures.html">Лекции</a><a href="health.html">Well-being</a><a href="pantry.html">Еда</a><a href="reads.html" class="on">Читать</a><a href="home.html">Дом</a></nav>
</div></header>

<main class="wrap">
  <div class="head"><h1>Читать</h1><div class="meta" id="meta"></div></div>

  <section class="sec">
    <div class="sechead">
      <h2>Советует Claude</h2>
      <div class="meta" id="recsMeta"></div>
      <div class="spacer"></div>
      <button id="refresh">Обновить</button>
    </div>
    <div class="arts" id="recs"></div>
    <div class="empty" id="recsEmpty" hidden>Пока пусто — нажми «Обновить», это займёт минуту.</div>
  </section>

  <section class="sec">
    <div class="sechead"><h2>Список чтения</h2><div class="meta" id="savedMeta"></div></div>
    <div class="arts rows" id="saved"></div>
    <div class="empty" id="savedEmpty" hidden>Ничего не отложено.</div>
  </section>

  <section class="sec" id="doneSec" hidden>
    <div class="sechead"><h2>Прочитано</h2></div>
    <ul class="done" id="done"></ul>
  </section>
</main>

<div class="saved" id="toast">Сохранено</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let toastTimer;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 1600); }
const fmtDay = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }); };
const sub = a => [a.author, a.date ? fmtDay(a.date) : '', a.minutes ? a.minutes + ' мин' : ''].filter(Boolean).join(' · ');
let updatedAt = null;

function card(a, acts) {
  const pic = a.image ? `<img src="${esc(a.image)}" alt="" loading="lazy">` : `<div class="ph">${esc(a.source)}</div>`;
  return `<article class="art" data-id="${esc(a.id)}">
    <a class="pic" href="${esc(a.url)}" target="_blank" rel="noopener">${pic}</a>
    <div class="body">
      <div class="src">${esc(a.source)}${sub(a) ? ' · ' + esc(sub(a)) : ''}</div>
      <h3><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></h3>
      ${a.reason ? `<div class="why">${esc(a.reason)}</div>` : ''}
      <div class="acts">${acts}</div>
    </div>
  </article>`;
}

function render(db) {
  updatedAt = (db && db.updatedAt) || null;
  const items = (db && db.items) || [], saved = (db && db.saved) || [];
  $('#recsMeta').textContent = db && db.updatedAt ? 'обновлено ' + fmtDay(db.updatedAt) : '';
  $('#recs').innerHTML = items.map(a => card(a,
    '<button class="take" data-act="saved">Прочту</button><button data-act="dismissed">Мимо</button>')).join('');
  $('#recsEmpty').hidden = !!items.length;
  $('#saved').innerHTML = saved.map(a => card(a, '<button data-act="read">Прочитал</button>')).join('');
  $('#savedMeta').textContent = saved.length ? saved.length + ' в очереди' : '';
  $('#savedEmpty').hidden = !!saved.length;
  const done = ((db && db.history) || []).filter(h => h.verdict === 'read').slice(0, 20);
  $('#doneSec').hidden = !done.length;
  $('#done').innerHTML = done.map(h => `<li><a href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title)}</a> · ${esc(h.source || '')}</li>`).join('');
}

async function load() {
  try {
    const db = await fetch('/api/reads', { cache: 'no-store' }).then(r => r.ok ? r.json() : null);
    render(db);
    return db;
  } catch { return null; }
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const art = b.closest('.art'), id = art.dataset.id;
  art.classList.add('gone');
  try {
    const out = await fetch('/api/read/' + encodeURIComponent(id), {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ verdict: b.dataset.act }),
    }).then(async r => { if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status); return r.json(); });
    render(out.reads);
    toast(b.dataset.act === 'saved' ? 'Отложил в список чтения' : b.dataset.act === 'read' ? 'Отметил прочитанным' : 'Понял, больше такого не предлагаю');
  } catch (err) { art.classList.remove('gone'); toast('Ошибка: ' + err.message); }
});

$('#refresh').addEventListener('click', async () => {
  const btn = $('#refresh');
  btn.disabled = true; btn.textContent = 'Ищу…';
  toast('Читаю ленты и спрашиваю Claude, это займёт минуту');
  const before = updatedAt;
  try {
    await fetch('/api/reads/refresh', { method: 'POST' });
    for (let i = 0; i < 72; i++) {
      await new Promise(r => setTimeout(r, 5000));
      const db = await load();
      if (db && db.job && String(db.job).startsWith('error')) { toast('Не получилось: ' + String(db.job).slice(7, 120)); break; }
      if (db && db.job === 'done') { toast(db.updatedAt && db.updatedAt !== before ? 'Готово: новые статьи' : 'Готово, список тот же'); break; }
    }
  } catch (e) { toast('Ошибка: ' + e.message); }
  btn.disabled = false; btn.textContent = 'Обновить';
});

load();
</script>
</body>
</html>

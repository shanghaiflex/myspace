<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Доброе утро</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --surface: #ffffff; --surface-2: #f2f2f4;
    --text: #1d1d1f; --text-2: #6e6e73; --text-3: #a1a1a6;
    --line: rgba(0,0,0,.08); --accent: #0071e3; --ok: #34c759;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
    --shadow-lg: 0 2px 8px rgba(0,0,0,.08), 0 24px 64px rgba(0,0,0,.18);
    --glass: rgba(250,250,250,.7);
    --photo-veil: linear-gradient(180deg, rgba(255,255,255,.2) 0%, rgba(250,250,250,.6) 50%, rgba(250,250,250,.97) 100%);
    --card: rgba(255,255,255,.66); --card-text: #1d1d1f; --card-text-2: rgba(29,29,31,.7); --card-text-3: rgba(29,29,31,.5);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --surface: #1c1c1e; --surface-2: #2c2c2e;
      --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #6e6e73;
      --line: rgba(255,255,255,.1); --accent: #2997ff; --ok: #30d158;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
      --shadow-lg: 0 2px 8px rgba(0,0,0,.5), 0 24px 64px rgba(0,0,0,.6);
      --glass: rgba(0,0,0,.55);
      --photo-veil: linear-gradient(180deg, rgba(0,0,0,.3) 0%, rgba(0,0,0,.6) 50%, rgba(0,0,0,.97) 100%);
      --card: rgba(22,22,24,.55); --card-text: #fff; --card-text-2: rgba(255,255,255,.72); --card-text-3: rgba(255,255,255,.48);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Inter, system-ui, sans-serif;
    background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.45; letter-spacing: -0.01em; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }

  .backdrop { position: fixed; inset: 0; z-index: -2; background: var(--bg); overflow: hidden; }
  .backdrop .ph { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.4s ease; transform: scale(1.04); }
  .backdrop .ph.on { opacity: 1; }
  .backdrop .veil { position: absolute; inset: 0; background: var(--photo-veil); }

  .bar { position: sticky; top: 0; z-index: 20; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
  .bar-inner { max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 20px; }
  .nav { display: flex; gap: 18px; font-size: 17px; letter-spacing: -0.02em; }
  .nav a { color: var(--text-3); font-weight: 600; }
  .nav a.on { color: var(--text); }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 56px 32px 100px; }
  .greet h1 { font-size: 44px; font-weight: 700; letter-spacing: -0.035em; margin: 0; line-height: 1.05; color: var(--card-text); text-shadow: 0 2px 24px rgba(0,0,0,.25); }
  .greet p { margin: 8px 0 0; color: var(--card-text-2); font-size: 17px; text-shadow: 0 1px 12px rgba(0,0,0,.25); }

  .cards { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; margin-top: 36px; }
  .card { background: var(--card); color: var(--card-text); border-radius: 24px; box-shadow: var(--shadow-lg); border: 1px solid rgba(255,255,255,.16);
    -webkit-backdrop-filter: saturate(160%) blur(28px); backdrop-filter: saturate(160%) blur(28px); padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0;
    transition: transform .25s cubic-bezier(.2,.7,.2,1); }
  a.card:hover { transform: translateY(-3px); }
  .card.c6 { grid-column: span 6; } .card.c4 { grid-column: span 4; } .card.c8 { grid-column: span 8; } .card.c12 { grid-column: span 12; }
  .card .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--card-text-2); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card .eyebrow .more { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--card-text-3); }
  .card h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.025em; margin: 0; line-height: 1.2; }
  .card .sub { color: var(--card-text-2); font-size: 14px; }
  .row { display: flex; gap: 16px; align-items: center; min-width: 0; }
  a.row { border-radius: 14px; margin: -6px; padding: 6px; }
  a.row:hover { background: color-mix(in srgb, var(--card-text) 8%, transparent); }
  .row .img { flex: 0 0 auto; border-radius: 12px; overflow: hidden; background: rgba(127,127,127,.2); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .row .img img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .img.sq { width: 96px; height: 96px; } .img.wide { width: 150px; height: 84px; }
  .row .txt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .row .txt h2 { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .prog { height: 4px; border-radius: 999px; background: color-mix(in srgb, var(--card-text) 16%, transparent); overflow: hidden; margin-top: 4px; }
  .prog i { display: block; height: 100%; background: var(--card-text); }
  .btn { align-self: flex-start; margin-top: auto; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px; background: var(--card-text); color: var(--bg); font-weight: 600; font-size: 14px; }
  @media (prefers-color-scheme: dark) { .btn { color: #111; } }
  .btn svg { width: 14px; height: 14px; }
  .card.art .acts { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }
  .card.art .acts .btn { margin-top: 0; }
  .card.art .acts button.btn { border: 1px solid color-mix(in srgb, var(--card-text) 28%, transparent); background: transparent; color: var(--card-text); font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; }
  .card.art .acts button.btn:hover { background: color-mix(in srgb, var(--card-text) 10%, transparent); }
  .card.art.gone { opacity: .4; pointer-events: none; }
  .card.art .thumb { flex: 0 0 auto; width: 132px; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; background: rgba(127,127,127,.2); box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .card.art .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (max-width: 680px) { .card.art .thumb { width: 96px; } }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .list a { display: flex; gap: 12px; align-items: center; min-width: 0; padding: 6px; margin: -6px; border-radius: 12px; }
  .list a:hover { background: color-mix(in srgb, var(--card-text) 8%, transparent); }
  .list.plain a { padding: 4px 6px; margin: 0 -6px; }
  .list .img { width: 92px; height: 52px; flex: 0 0 auto; border-radius: 8px; overflow: hidden; background: rgba(127,127,127,.2); }
  .list .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .list .t { font-size: 14px; font-weight: 600; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .list .s { font-size: 12px; color: var(--card-text-3); }
  .posters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .posters a { aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden; background: rgba(127,127,127,.2); box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  .posters img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .img.book { width: 72px; height: 108px; border-radius: 8px; }
  .card.wx { padding: 14px 20px; border-radius: 18px; }
  .wxrow { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .wxicon { font-size: 30px; line-height: 1; }
  .wxtemp { font-size: 32px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .wxtxt { min-width: 0; }
  .wxtxt .t { font-size: 14px; font-weight: 600; }
  .wxtxt .s { font-size: 12.5px; color: var(--card-text-2); margin-top: 1px; }
  .hours { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .hours .hr { flex: 0 0 auto; min-width: 38px; text-align: center; padding: 4px 2px; border-radius: 9px; }
  .hours .hr.wet { background: color-mix(in srgb, #0a84ff 18%, transparent); }
  .hours .s { font-size: 10px; color: var(--card-text-3); }
  .hours .ic { font-size: 14px; line-height: 1.3; }
  .hours .t { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  @media (max-width: 900px) { .hours { margin-left: 0; width: 100%; } }
  .card.wx.c4 { padding: 18px 20px; border-radius: 24px; justify-content: space-between; }
  .card.wx.c4 .wxrow { flex-wrap: nowrap; }
  .card.wx.c4 .hours { margin-left: 0; width: 100%; }
  .card.wx.c4 .hours .hr { min-width: 34px; }
  /* Дела на сегодня: одна полоса «плашек» — событие за событием, прошедшие приглушены, текущее подсвечено. */
  .card.sc { padding: 14px 20px; border-radius: 18px; gap: 10px; }
  .sc .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .sc .ch { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 12px; border-radius: 999px; font-size: 14.5px; font-weight: 600;
    background: color-mix(in srgb, var(--card-text) 9%, transparent); }
  .sc .ch .tm { font-size: 12.5px; font-weight: 600; color: var(--card-text-3); font-variant-numeric: tabular-nums; }
  .sc .ch.past { opacity: .42; }
  .sc .ch.now { background: color-mix(in srgb, var(--accent) 34%, transparent); }
  .sc .ch.now .tm { color: var(--card-text-2); }
  .sc .ch.free-ev { background: transparent; border: 1px dashed color-mix(in srgb, var(--card-text) 22%, transparent); }
  .sc .ch.empty { background: transparent; padding: 0; color: var(--card-text-2); font-weight: 500; }
  /* Чем занять окно: плитки того, что влезает в ближайшую дыру в дне (/api/fit). */
  .card.fit { padding: 14px 20px; border-radius: 18px; gap: 10px; }
  .fit .picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .fit .pick { display: flex; gap: 10px; align-items: center; min-width: 0; padding: 8px; border-radius: 14px;
    background: color-mix(in srgb, var(--card-text) 7%, transparent); }
  a.fit-pick:hover { background: color-mix(in srgb, var(--card-text) 13%, transparent); }
  .fit .pick .img { width: 58px; height: 44px; flex: 0 0 auto; border-radius: 8px; overflow: hidden; background: rgba(127,127,127,.2);
    display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .fit .pick .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fit .pick .txt { min-width: 0; }
  .fit .pick .t { font-size: 13.5px; font-weight: 600; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .fit .pick .s { font-size: 11.5px; color: var(--card-text-3); margin-top: 2px; }
  @media (max-width: 900px) { .fit .picks { grid-template-columns: 1fr; } }
  .card.lc { padding: 18px 20px; gap: 10px; }
  .card.lc h2 { font-size: 16px; }
  .card.lc .img.sq { width: 64px; height: 64px; } .card.lc .img.wide { width: 104px; height: 60px; }
  .card.lc .btn { height: 34px; padding: 0 14px; font-size: 13px; margin-top: 2px; }
  .stats { display: flex; gap: 26px; flex-wrap: wrap; color: var(--card-text-2); font-size: 13px; }
  .card .note { font-size: 13.5px; line-height: 1.45; color: var(--card-text-2); margin: 0; }
  .card.hl .note { font-size: 18px; line-height: 1.4; letter-spacing: -0.02em; margin: 0; font-weight: 500; white-space: pre-wrap; }
  .card.hl .stats { gap: 22px; }
  .card.hl .stats b { font-size: 18px; }
  .stats b { color: var(--card-text); font-size: 20px; font-weight: 700; letter-spacing: -0.02em; display: block; font-variant-numeric: tabular-nums; }
  @media (max-width: 900px) { .card.c6, .card.c4, .card.c8 { grid-column: span 12; } }
  @media (max-width: 640px) {
    .bar-inner { padding: 12px 16px; } .nav { font-size: 15px; gap: 14px; }
    .wrap { padding: 28px 16px 80px; } .greet h1 { font-size: 32px; } .cards { gap: 14px; margin-top: 24px; } .card { padding: 18px; border-radius: 20px; }
    .img.sq { width: 76px; height: 76px; } .img.wide { width: 120px; height: 68px; }
  }
/* Phone: the nav wraps onto a second row instead of pushing the page sideways (the sticky bar ended at «Еда»
   and the whole page scrolled horizontally in the BoW app). */
@media (max-width: 760px) {
  html, body { overflow-x: hidden; }
  .bar-inner { flex-wrap: wrap; }
  .nav { flex-wrap: wrap; gap: 6px 14px; font-size: 15px; }
}
</style>

<script src="app.js"></script>
</head>
<body>
<div class="backdrop"><div class="ph on" id="ph"></div><div class="veil"></div></div>
<header class="bar"><div class="bar-inner">
  <nav class="nav"><a href="index.html" class="on">Главная</a><a href="films.html">Фильмы</a><a href="books.html">Книги</a><a href="mixes.html">Миксы</a><a href="lectures.html">Лекции</a><a href="health.html">Well-being</a><a href="pantry.html">Еда</a><a href="reads.html">Читать</a><a href="french.html">Французский</a><a href="home.html">Дом</a></nav>
</div></header>

<main class="wrap">
  <div class="greet"><h1 id="greet">Доброе утро</h1><p id="date"></p></div>
  <div class="cards" id="cards"></div>
</main>

<script src="rec.js"></script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const { fmtDur, thumb, seriesName, channelName, recommend } = Lect;
const h = new Date().getHours();
document.getElementById('greet').textContent = h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер';
document.getElementById('date').textContent = new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>';
// До девяти утра — спокойное: читать под ритмичный микс нельзя (тег calm в коллекции, mood у советов).
const MORNING_UNTIL = 9;
const isMorning = () => new Date().getHours() < MORNING_UNTIL;
const isCalm = m => m.mood === 'calm' || (m.tags || []).includes('calm');
const pick = (arr, n) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, n); };
const j = (url, fb) => fetch(url, { cache: 'no-store' }).then(r => r.ok ? r.json() : fb).catch(() => fb);

Promise.all([j('lectures.json', { lectures: [], series: {} }), j('mixes.json', []), j('/api/backgrounds', []), j('/api/weather', null), j('books.json', []), j('/api/health', null), j('/api/mix-recs', null), j('/api/reads', null), j('/api/schedule', null), j('/api/french', null), j('/api/fit', null)]).then(([lect, mixes, bgs, wx, books, hl, recs, reads, sched, fr, fit]) => {
  if (bgs.length) document.getElementById('ph').style.backgroundImage = `url("${bgs[Math.floor(Math.random() * bgs.length)]}")`;
  const cards = [];
  // Дела на сегодня — плашка над всем остальным: события Яндекс.Календаря (все календари, кроме чужих
  // тренировок — их отсеивает сервер) и свободные окна дня. Утром это первое, что нужно видеть.
  // Рабочий блок 10:00–18:00 стоит в календаре каждый будний день и делом не является: если кроме него
  // на сегодня ничего нет, плашки нет вовсе — пустая полоса «Работа» каждое утро не нужна.
  const ROUTINE = /^\s*работа\s*$/i;
  const schedCard = (sc) => {
    if (!sc || !(sc.events || []).some(e => !ROUTINE.test(e.title))) return '';
    const now = new Date();
    const chip = e => {
      const st = new Date(e.start), en = new Date(e.end);
      const on = !e.allday && st <= now && en > now;
      const cls = e.allday ? '' : en <= now ? 'past' : on ? 'now' : '';
      // У того, что идёт сейчас, видно и когда оно кончится, — остальное читается одним временем начала.
      const tm = e.allday ? 'весь день' : on ? `${e.from}–${e.to}` : e.from;
      return `<span class="ch ${cls} ${e.busy ? '' : 'free-ev'}"><span class="tm">${esc(tm)}</span>${esc(e.title)}</span>`;
    };
    const ahead = sc.events.filter(e => e.allday || new Date(e.end) > now);
    const more = [];
    if ((sc.free || []).length) more.push('свободно ' + sc.free.slice(0, 2).map(f => `${f.from}–${f.to}`).join(', '));
    if (!ahead.length && sc.tomorrow) more.push(`завтра с ${sc.tomorrow.from} — ${sc.tomorrow.title}`);
    return `<div class="card c12 sc"><div class="eyebrow">Дела на сегодня${more.length ? ` <span class="more">${esc(more.join(' · '))}</span>` : ''}</div>
      <div class="chips">${sc.events.map(chip).join('')}</div></div>`;
  };

  const sd = schedCard(sched);
  if (sd) cards.push(sd);

  // «Чем занять» — то, ради чего сайт вообще знает и календарь, и погоду, и длину каждой лекции:
  // не «что посмотреть вообще», а что целиком влезает в ближайшую дыру в дне. Считает /api/fit.
  const fitCard = (f) => {
    if (!f || !f.window || !(f.picks || []).length) return '';
    const w = f.window, wx = f.weather;
    const head = w.open ? `Свободно до ${esc(w.to)}` : `Свободно ${esc(w.from)}–${esc(w.to)}`;
    const more = [w.length, wx ? `${wx.icon} ${(wx.temp > 0 ? '+' : '') + wx.temp}°` : '',
      wx && wx.precip >= 20 ? `осадки ${wx.precip}%` : ''].filter(Boolean).join(' · ');
    const tile = p => {
      const inner = `<div class="img">${p.image ? `<img src="${esc(p.image)}" alt="" onerror="this.remove()">` : (p.kind === 'walk' && wx ? wx.icon : '')}</div>
        <div class="txt"><div class="t">${esc(p.title)}</div><div class="s">${esc(p.sub)}${p.fits === false ? ' · не влезет целиком' : ''}</div></div>`;
      // У прогулки ссылки нет: это не страница сайта, а совет выйти из дома.
      return p.url
        ? `<a class="pick fit-pick" href="${esc(p.url)}"${p.external ? ' target="_blank" rel="noopener"' : ''}>${inner}</a>`
        : `<div class="pick">${inner}</div>`;
    };
    return `<div class="card c12 fit"><div class="eyebrow">${head}${more ? ` <span class="more">${esc(more)}</span>` : ''}</div>
      <div class="picks">${f.picks.map(tile).join('')}</div></div>`;
  };
  const fitc = fitCard(fit);
  if (fitc) cards.push(fitc);

  if (wx && wx.now) {
    const sign = t => (t > 0 ? '+' : '') + t + '°';
    const rainy = wx.hours.filter(h => h.day && (h.precipProb || 0) >= 40);
    const precip = wx.today.precipSum > 0 || wx.today.precipProbMax >= 40
      ? `${wx.today.precipSum > 0 ? wx.today.precipSum + ' мм' : 'осадки'}, ${wx.today.precipProbMax}%${rainy.length ? ` в ${rainy[0].time}–${rainy[rainy.length - 1].time}` : ''}`
      : 'без осадков';
    const side = !!(hl && (hl.review || hl.lastIngest));
    cards.push(`<div class="card ${side ? 'c4' : 'c12'} wx"><div class="wxrow">
        <span class="wxicon">${wx.now.icon}</span><span class="wxtemp">${sign(wx.now.temp)}</span>
        <div class="wxtxt"><div class="t">${esc(wx.now.condition)}, ощущается ${sign(wx.now.feels)}</div>
          <div class="s">${esc(wx.city)} · днём ${sign(wx.today.tmax)}, ночью ${sign(wx.today.tmin)} · ${wx.today.icon} ${precip} · ветер ${wx.now.wind} м/с</div></div>
        <div class="hours">${wx.hours.slice(0, side ? 8 : 12).map(h => `<div class="hr ${(h.precipProb || 0) >= 40 ? 'wet' : ''}"><div class="s">${h.time.slice(0, 2)}</div><div class="ic">${h.icon}</div><div class="t">${sign(h.temp).replace('°', '')}</div></div>`).join('')}</div>
      </div></div>`);
  }
  if (hl && (hl.review || hl.lastIngest)) {
    const hm = m => m == null ? '—' : `${Math.floor(m / 60)}ч${String(Math.round(m) % 60).padStart(2, '0')}`;
    const t = hl.days[0] || {}, a = hl.avg7 || {};
    // A note written during the night is not advice worth reading over breakfast; the server marks it stale.
    const note = hl.review && !hl.review.stale ? hl.review : null;
    const when = note ? new Date(note.ts) : null;
    const whenTxt = when ? (when.toDateString() === new Date().toDateString() ? '' : when.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ', ') + when.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
    const noteMore = whenTxt ? 'заметка ' + esc(whenTxt) : (hl.review ? 'свежей заметки ещё нет' : 'заметки пока нет');
    cards.push(`<a class="card ${wx && wx.now ? 'c8' : 'c12'} hl" href="health.html"><div class="eyebrow">Well-being <span class="more">${noteMore}</span></div>
      ${note ? `<p class="note">${esc(note.text)}</p>` : ''}
      <div class="stats"><div><b>${t.sleep ? hm(t.sleep.total) : '—'}</b>сон</div><div><b>${t.rhr ?? '—'}</b>пульс покоя</div><div><b>${t.hrv ?? '—'}</b>HRV</div>
        <div><b>${t.steps != null ? Math.round(t.steps).toLocaleString('ru-RU') : '—'}</b>шагов сегодня${a.steps ? ' · ср. ' + Math.round(a.steps).toLocaleString('ru-RU') : ''}</div>
        ${t.workouts && t.workouts.length ? `<div><b>${esc(t.workouts.map(w => w.ru).join(', '))}</b>тренировка</div>` : ''}</div></a>`);
  }
  // two mix cards side by side: a random one from the collection and Claude's fresh advice
  const morning = isMorning();
  const recItems = (recs && recs.items) || [];
  const recPool = morning && recItems.some(isCalm) ? recItems.filter(isCalm) : recItems;
  const rec = recPool.find(r => !r.played) || recPool[0];
  const mixPool = morning && mixes.some(isCalm) ? mixes.filter(isCalm) : mixes;
  const mix = pick(mixPool, 1)[0];
  const mixCard = (m, cls, eyebrow, more, reason) => `<a class="card ${cls}" href="mixes.html#${encodeURIComponent(m.id)}">
      <div class="eyebrow">${eyebrow}${more ? ` <span class="more">${more}</span>` : ''}</div>
      <div class="row"><div class="img sq">${m.artwork ? `<img src="${esc(m.artwork)}" alt="">` : ''}</div><div class="txt"><h2>${esc(m.title)}</h2><div class="sub">${esc(m.artist || '')} · ${fmtDur(m.duration)}</div></div></div>
      ${reason ? `<p class="note">${esc(reason)}</p>` : ''}
      <span class="btn">${PLAY} ${reason ? 'Послушать' : 'Играть'}</span></a>`;
  const reading = books.filter(b => b.status === 'reading');

  // One card for lectures, not one per channel: what matters is the lecture actually in progress — the most
  // recently touched one — and the two channels were two half-empty cards saying the same thing twice.
  const lectureCard = () => {
    const all = lect.lectures || [];
    const listening = all.filter(l => l.status === 'listening')
      .sort((a, b) => (b.touchedAt || 0) - (a.touchedAt || 0) || (b.position || 0) - (a.position || 0));
    const queued = all.filter(l => l.status === 'queued').sort((a, b) => (a.queuedAt || 0) - (b.queuedAt || 0));
    const next = listening[0] || queued[0] || recommend(lect, 1)[0];
    if (!next) return '';
    const ch = (lect.channels || []).find(c => c.id === next.channel) || {};
    const pct = next.status === 'listening' && next.duration ? Math.min(100, (next.position || 0) / next.duration * 100) : 0;
    const ahead = queued.filter(l => l.id !== next.id).length;
    const state = next.status === 'listening' ? Lect.fmtTime(next.position || 0) + ' из '
      : next.status === 'queued' ? 'в планах · ' : 'рекомендую · ';
    return `<div class="card c6 lc"><div class="eyebrow">Лекция <a class="more" href="lectures.html">${esc(ch.label || ch.name || 'все')} →</a></div>
      <a class="row" href="lectures.html#${esc(next.id)}"><div class="img ${ch.type === 'soundcloud' ? 'sq' : 'wide'}">${thumb(next) ? `<img src="${esc(thumb(next))}" alt="" onerror="this.onerror=null;this.src=this.src.replace('mqdefault','hqdefault')">` : ''}</div>
        <div class="txt"><h2>${esc(next.title)}</h2><div class="sub">${esc(seriesName(lect, next))} · ${state}${fmtDur(next.duration)}${ahead ? ` · в планах ещё ${ahead}` : ''}</div>${pct ? `<div class="prog"><i style="width:${pct}%"></i></div>` : ''}</div></a>
      <a class="btn" href="lectures.html#${esc(next.id)}">${PLAY} ${next.status === 'listening' ? 'Слушать дальше' : 'Слушать'}</a></div>`;
  };

  // Статья дня: ссылка ведёт в текст, а «Прочту»/«Мимо» — те же вердикты, что на странице «Читать»
  // (первую версию карточки без кнопок пользователь принял за отсутствие оценок вовсе).
  const artCard = (r) => {
    const art = ((r && r.items) || [])[0];
    if (!art) return '';
    const more = (r.items || []).length - 1;
    return `<div class="card c6 art" data-id="${esc(art.id)}"><div class="eyebrow">Почитать <span class="more">${esc(art.source || '')}${art.minutes ? ' · ' + art.minutes + ' мин' : ''}</span></div>
      <div class="row">${art.image ? `<a class="thumb" href="${esc(art.url)}" target="_blank" rel="noopener"><img src="${esc(art.image)}" alt=""></a>` : ''}<h2><a href="${esc(art.url)}" target="_blank" rel="noopener">${esc(art.title)}</a></h2></div>
      <div class="sub">${esc(art.reason || '')}${more > 0 ? ` <span class="more">· ещё ${more} на странице «Читать»</span>` : ''}</div>
      <div class="acts"><a class="btn" href="${esc(art.url)}" target="_blank" rel="noopener">Открыть</a><button class="btn" data-act="saved">Прочту</button><button class="btn" data-act="dismissed">Мимо</button></div></div>`;
  };

  // Порядок карточек задан пользователем 14.09.2026: дела на сегодня, погода, самочувствие, лекция, статья, миксы, книга.
  const lc = lectureCard();
  if (lc) cards.push(lc);
  if (artCard(reads)) cards.push(artCard(reads));
  if (mix) cards.push(mixCard(mix, 'c6',
    morning && isCalm(mix) ? 'Под утреннее чтение' : 'Микс на сегодня',
    morning && isCalm(mix) ? 'спокойный' : 'случайный'));
  if (rec) cards.push(mixCard(rec, 'c6', 'Совет от Claude',
    rec.played ? 'уже включал' : (morning && isCalm(rec) ? 'спокойное' : ''), rec.reason));
  // Французский: то, чем заниматься сегодня, и сколько слов ждёт повторения. Карточка последняя —
  // порядок остальных пользователь задал 14.09.2026 и трогать его незачем.
  const frenchCard = (f) => {
    if (!f) return '';
    const m = (f.items || []).find(x => x.lesson) || (f.items || [])[0];
    const due = (f.due || []).length;
    if (!m && !due) return '';
    const les = (m && m.lesson) || {};
    const n = (les.quiz || []).length, w = (les.words || []).length;
    const more = due ? `${due} ${due % 10 === 1 && due % 100 !== 11 ? 'слово' : 'слов'} к повторению` : '';
    if (!m) return `<a class="card c6" href="french.html"><div class="eyebrow">Французский <span class="more">${esc(more)}</span></div>
      <div class="row"><div class="txt"><h2>Повторить слова</h2><div class="sub">материалы кончились — на странице можно попросить новые</div></div></div>
      <span class="btn">Повторить</span></a>`;
    return `<a class="card c6" href="french.html"><div class="eyebrow">Французский${more ? ` <span class="more">${esc(more)}</span>` : ''}</div>
      <div class="row"><div class="img ${m.kind === 'video' ? 'wide' : 'sq'}">${m.image ? `<img src="${esc(m.image)}" alt="" onerror="this.remove()">` : ''}</div>
        <div class="txt"><h2>${esc(m.title)}</h2><div class="sub">${esc([m.source, m.minutes ? m.minutes + ' мин' : '', les.builtAt ? `${w} слов · тест из ${n}` : 'разбор собирается'].filter(Boolean).join(' · '))}</div></div></div>
      ${m.why ? `<p class="note">${esc(m.why)}</p>` : ''}
      <span class="btn">Заниматься</span></a>`;
  };

  if (reading.length) {
    const b = reading[0];
    cards.push(`<a class="card c6" href="books.html#${esc(b.id)}"><div class="eyebrow">Читаю <span class="more">${reading.length > 1 ? 'и ещё ' + (reading.length - 1) : ''}</span></div>
      <div class="row"><div class="img book">${b.cover ? `<img src="${esc(b.cover)}" alt="">` : ''}</div><div class="txt"><h2>${esc(b.title)}</h2><div class="sub">${esc(b.author || '')}</div></div></div></a>`);
  }
  const fc = frenchCard(fr);
  if (fc) cards.push(fc);
  document.getElementById('cards').innerHTML = cards.join('');
  document.getElementById('cards').addEventListener('click', async e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const card = b.closest('.card.art'); card.classList.add('gone');
    try {
      const out = await fetch('/api/read/' + encodeURIComponent(card.dataset.id), {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ verdict: b.dataset.act }),
      }).then(async r => { if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status); return r.json(); });
      const next = artCard(out.reads);
      if (next) card.outerHTML = next; else card.remove();
    } catch (err) { card.classList.remove('gone'); b.textContent = 'Ошибка: ' + err.message; }
  });
});
</script>
</body>
</html>

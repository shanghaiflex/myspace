<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Доброе утро</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --surface: #ffffff; --surface-2: #f2f2f4;
    --text: #1d1d1f; --text-2: #6e6e73; --text-3: #a1a1a6;
    --line: rgba(0,0,0,.08); --accent: #0071e3; --ok: #34c759;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
    --shadow-lg: 0 2px 8px rgba(0,0,0,.08), 0 24px 64px rgba(0,0,0,.18);
    --glass: rgba(250,250,250,.7);
    --photo-veil: linear-gradient(180deg, rgba(255,255,255,.2) 0%, rgba(250,250,250,.6) 50%, rgba(250,250,250,.97) 100%);
    --card: rgba(255,255,255,.66); --card-text: #1d1d1f; --card-text-2: rgba(29,29,31,.7); --card-text-3: rgba(29,29,31,.5);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --surface: #1c1c1e; --surface-2: #2c2c2e;
      --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #6e6e73;
      --line: rgba(255,255,255,.1); --accent: #2997ff; --ok: #30d158;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
      --shadow-lg: 0 2px 8px rgba(0,0,0,.5), 0 24px 64px rgba(0,0,0,.6);
      --glass: rgba(0,0,0,.55);
      --photo-veil: linear-gradient(180deg, rgba(0,0,0,.3) 0%, rgba(0,0,0,.6) 50%, rgba(0,0,0,.97) 100%);
      --card: rgba(22,22,24,.55); --card-text: #fff; --card-text-2: rgba(255,255,255,.72); --card-text-3: rgba(255,255,255,.48);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Inter, system-ui, sans-serif;
    background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.45; letter-spacing: -0.01em; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }

  .backdrop { position: fixed; inset: 0; z-index: -2; background: var(--bg); overflow: hidden; }
  .backdrop .ph { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.4s ease; transform: scale(1.04); }
  .backdrop .ph.on { opacity: 1; }
  .backdrop .veil { position: absolute; inset: 0; background: var(--photo-veil); }

  .bar { position: sticky; top: 0; z-index: 20; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
  .bar-inner { max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 20px; }
  .nav { display: flex; gap: 18px; font-size: 17px; letter-spacing: -0.02em; }
  .nav a { color: var(--text-3); font-weight: 600; }
  .nav a.on { color: var(--text); }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 56px 32px 100px; }
  .greet h1 { font-size: 44px; font-weight: 700; letter-spacing: -0.035em; margin: 0; line-height: 1.05; color: var(--card-text); text-shadow: 0 2px 24px rgba(0,0,0,.25); }
  .greet p { margin: 8px 0 0; color: var(--card-text-2); font-size: 17px; text-shadow: 0 1px 12px rgba(0,0,0,.25); }

  .cards { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; margin-top: 36px; }
  .card { background: var(--card); color: var(--card-text); border-radius: 24px; box-shadow: var(--shadow-lg); border: 1px solid rgba(255,255,255,.16);
    -webkit-backdrop-filter: saturate(160%) blur(28px); backdrop-filter: saturate(160%) blur(28px); padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0;
    transition: transform .25s cubic-bezier(.2,.7,.2,1); }
  a.card:hover { transform: translateY(-3px); }
  .card.c6 { grid-column: span 6; } .card.c4 { grid-column: span 4; } .card.c8 { grid-column: span 8; } .card.c12 { grid-column: span 12; }
  .card .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--card-text-2); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card .eyebrow .more { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--card-text-3); }
  .card h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.025em; margin: 0; line-height: 1.2; }
  .card .sub { color: var(--card-text-2); font-size: 14px; }
  .row { display: flex; gap: 16px; align-items: center; min-width: 0; }
  a.row { border-radius: 14px; margin: -6px; padding: 6px; }
  a.row:hover { background: color-mix(in srgb, var(--card-text) 8%, transparent); }
  .row .img { flex: 0 0 auto; border-radius: 12px; overflow: hidden; background: rgba(127,127,127,.2); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .row .img img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .img.sq { width: 96px; height: 96px; } .img.wide { width: 150px; height: 84px; }
  .row .txt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .row .txt h2 { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .prog { height: 4px; border-radius: 999px; background: color-mix(in srgb, var(--card-text) 16%, transparent); overflow: hidden; margin-top: 4px; }
  .prog i { display: block; height: 100%; background: var(--card-text); }
  .btn { align-self: flex-start; margin-top: auto; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px; background: var(--card-text); color: var(--bg); font-weight: 600; font-size: 14px; }
  @media (prefers-color-scheme: dark) { .btn { color: #111; } }
  .btn svg { width: 14px; height: 14px; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .list a { display: flex; gap: 12px; align-items: center; min-width: 0; padding: 6px; margin: -6px; border-radius: 12px; }
  .list a:hover { background: color-mix(in srgb, var(--card-text) 8%, transparent); }
  .list .img { width: 92px; height: 52px; flex: 0 0 auto; border-radius: 8px; overflow: hidden; background: rgba(127,127,127,.2); }
  .list .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .list .t { font-size: 14px; font-weight: 600; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .list .s { font-size: 12px; color: var(--card-text-3); }
  .posters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .posters a { aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden; background: rgba(127,127,127,.2); box-shadow: 0 6px 18px rgba(0,0,0,.3); }
  .posters img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .img.book { width: 72px; height: 108px; border-radius: 8px; }
  .wxrow { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .wxnow { display: flex; align-items: center; gap: 12px; }
  .wxicon { font-size: 44px; line-height: 1; }
  .wxtemp { font-size: 52px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .wxtxt .t, .wxday .t { font-size: 15px; font-weight: 600; }
  .wxtxt .s, .wxday .s { font-size: 13px; color: var(--card-text-2); margin-top: 2px; }
  .wxday { padding-left: 28px; border-left: 1px solid color-mix(in srgb, var(--card-text) 14%, transparent); }
  .hours { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .hours .hr { flex: 0 0 auto; min-width: 58px; text-align: center; padding: 8px 4px; border-radius: 12px; }
  .hours .hr.wet { background: color-mix(in srgb, #0a84ff 16%, transparent); }
  .hours .s { font-size: 11px; color: var(--card-text-3); }
  .hours .ic { font-size: 20px; line-height: 1.3; }
  .hours .t { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .hours .pp { font-size: 11px; color: #4aa3ff; min-height: 1.2em; font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) { .wxday { padding-left: 0; border-left: 0; } .wxtemp { font-size: 40px; } }
  .stats { display: flex; gap: 26px; flex-wrap: wrap; color: var(--card-text-2); font-size: 13px; }
  .stats b { color: var(--card-text); font-size: 20px; font-weight: 700; letter-spacing: -0.02em; display: block; font-variant-numeric: tabular-nums; }
  @media (max-width: 900px) { .card.c6, .card.c4, .card.c8 { grid-column: span 12; } }
  @media (max-width: 640px) {
    .bar-inner { padding: 12px 16px; } .nav { font-size: 15px; gap: 14px; }
    .wrap { padding: 28px 16px 80px; } .greet h1 { font-size: 32px; } .cards { gap: 14px; margin-top: 24px; } .card { padding: 18px; border-radius: 20px; }
    .img.sq { width: 76px; height: 76px; } .img.wide { width: 120px; height: 68px; }
  }
</style>
</head>
<body>
<div class="backdrop"><div class="ph on" id="ph"></div><div class="veil"></div></div>
<header class="bar"><div class="bar-inner">
  <nav class="nav"><a href="index.html" class="on">Главная</a><a href="films.html">Фильмы</a><a href="books.html">Книги</a><a href="mixes.html">Миксы</a><a href="lectures.html">Лекции</a></nav>
</div></header>

<main class="wrap">
  <div class="greet"><h1 id="greet">Доброе утро</h1><p id="date"></p></div>
  <div class="cards" id="cards"></div>
</main>

<script src="rec.js"></script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const { fmtDur, thumb, seriesName, channelName, recommend } = Lect;
const h = new Date().getHours();
document.getElementById('greet').textContent = h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер';
document.getElementById('date').textContent = new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>';
const pick = (arr, n) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, n); };
const j = (url, fb) => fetch(url, { cache: 'no-store' }).then(r => r.ok ? r.json() : fb).catch(() => fb);

Promise.all([j('lectures.json', { lectures: [], series: {} }), j('mixes.json', []), j('movies.json', []), j('/api/backgrounds', []), j('/api/weather', null), j('books.json', [])]).then(([lect, mixes, movies, bgs, wx, books]) => {
  if (bgs.length) document.getElementById('ph').style.backgroundImage = `url("${bgs[Math.floor(Math.random() * bgs.length)]}")`;
  const cards = [];
  if (wx && wx.now) {
    const rainy = wx.hours.filter(h => h.day && (h.precipProb || 0) >= 40);
    const precipLine = wx.today.precipSum > 0 || wx.today.precipProbMax >= 40
      ? `Осадки: ${wx.today.precipSum} мм, вероятность до ${wx.today.precipProbMax}%${rainy.length ? ` · ${rainy[0].time}–${rainy[rainy.length - 1].time}` : ''}`
      : 'Без осадков';
    cards.push(`<div class="card c12 wx"><div class="eyebrow">${esc(wx.city)} · сегодня <span class="more">${esc(wx.source)}</span></div>
      <div class="wxrow">
        <div class="wxnow"><span class="wxicon">${wx.now.icon}</span><span class="wxtemp">${wx.now.temp > 0 ? '+' : ''}${wx.now.temp}°</span>
          <div class="wxtxt"><div class="t">${esc(wx.now.condition)}</div><div class="s">ощущается ${wx.now.feels > 0 ? '+' : ''}${wx.now.feels}° · ветер ${wx.now.wind} м/с</div></div></div>
        <div class="wxday"><div class="t">${wx.today.icon} ${esc(wx.today.condition)} · днём до ${wx.today.tmax > 0 ? '+' : ''}${wx.today.tmax}°, ночью ${wx.today.tmin > 0 ? '+' : ''}${wx.today.tmin}°</div>
          <div class="s">${precipLine} · восход ${wx.today.sunrise}, закат ${wx.today.sunset}</div></div>
      </div>
      <div class="hours">${wx.hours.slice(0, 16).map(h => `<div class="hr ${(h.precipProb || 0) >= 40 ? 'wet' : ''}"><div class="s">${h.time}</div><div class="ic">${h.icon}</div><div class="t">${h.temp > 0 ? '+' : ''}${h.temp}°</div><div class="pp">${h.precipProb ? h.precipProb + '%' : ''}</div></div>`).join('')}</div>
    </div>`);
  }
  const mix = pick(mixes, 1)[0];
  const reading = books.filter(b => b.status === 'reading');
  const toRead = pick(books.filter(b => b.status === 'to-read' && b.cover), 4);
  const toWatch = pick(movies.filter(m => m.status === 'to-watch' && m.poster), 4);

  // One card per lecture channel: "next up" (listening, else first queued, else best recommendation) + what follows.
  const chanCard = (ch, label) => {
    const mine = lect.lectures.filter(l => l.channel === ch.id);
    const listening = mine.filter(l => l.status === 'listening').sort((a, b) => (b.position || 0) - (a.position || 0));
    const queued = mine.filter(l => l.status === 'queued').sort((a, b) => (a.queuedAt || 0) - (b.queuedAt || 0));
    const recs = recommend(lect, 6, ch.id).filter(l => l.status !== 'queued');
    const next = listening[0] || queued[0] || recs[0];
    if (!next) return '';
    const rest = [...listening.slice(1), ...queued.filter(l => l !== next), ...recs.filter(l => l !== next)].slice(0, 4);
    const pct = next.status === 'listening' && next.duration ? Math.min(100, (next.position || 0) / next.duration * 100) : 0;
    const tag = l => l.status === 'listening' ? 'слушаю · ' + Lect.fmtTime(l.position || 0) : l.status === 'queued' ? 'в планах' : 'рекомендую';
    const sq = ch.type === 'soundcloud';
    return `<div class="card c6"><div class="eyebrow">${esc(label)} <a class="more" href="lectures.html#channel=${encodeURIComponent(ch.id)}">все →</a></div>
      <a class="row" href="lectures.html#${esc(next.id)}"><div class="img ${sq ? 'sq' : 'wide'}">${thumb(next) ? `<img src="${esc(thumb(next))}" alt="" onerror="this.onerror=null;this.src=this.src.replace('mqdefault','hqdefault')">` : ''}</div>
        <div class="txt"><h2>${esc(next.title)}</h2><div class="sub">${esc(seriesName(lect, next))}</div>
        <div class="sub">${next.status === 'listening' ? Lect.fmtTime(next.position || 0) + ' из ' : ''}${fmtDur(next.duration)}</div>${pct ? `<div class="prog"><i style="width:${pct}%"></i></div>` : ''}</div></a>
      ${rest.length ? `<div class="sub" style="margin-top:4px">Дальше</div><div class="list">${rest.map(l => `<a href="lectures.html#${esc(l.id)}"><div class="img" style="${sq ? 'width:52px;height:52px' : ''}">${thumb(l) ? `<img src="${esc(thumb(l))}" alt="" loading="lazy" onerror="this.onerror=null;this.src=this.src.replace('mqdefault','hqdefault')">` : ''}</div><div style="min-width:0"><div class="t">${esc(l.title)}</div><div class="s">${tag(l)} · ${fmtDur(l.duration)}</div></div></a>`).join('')}</div>` : ''}
      <a class="btn" href="lectures.html#${esc(next.id)}">${PLAY} ${next.status === 'listening' ? 'Слушать дальше' : 'Слушать'}</a></div>`;
  };
  for (const ch of (lect.channels || [])) cards.push(chanCard(ch, ch.label || ch.name));
  if (mix) {
    cards.push(`<a class="card ${toWatch.length ? 'c4' : 'c12'}" href="mixes.html#${encodeURIComponent(mix.id)}">
      <div class="eyebrow">Микс на сегодня <span class="more">случайный</span></div>
      <div class="row"><div class="img sq">${mix.artwork ? `<img src="${esc(mix.artwork)}" alt="">` : ''}</div><div class="txt"><h2>${esc(mix.title)}</h2><div class="sub">${esc(mix.artist || '')} · ${fmtDur(mix.duration)}</div></div></div>
      <span class="btn">${PLAY} Играть</span></a>`);
  }
  if (reading.length || toRead.length) {
    const b = reading[0];
    cards.push(`<div class="card c4"><div class="eyebrow">${b ? 'Читаю' : 'Хочу прочитать'} <a class="more" href="books.html${b ? '' : '#to-read'}">все →</a></div>
      ${b ? `<a class="row" href="books.html#${esc(b.id)}"><div class="img book">${b.cover ? `<img src="${esc(b.cover)}" alt="">` : ''}</div><div class="txt"><h2>${esc(b.title)}</h2><div class="sub">${esc(b.author || '')}</div>${reading.length > 1 ? `<div class="sub">и ещё ${reading.length - 1}</div>` : ''}</div></a>` : ''}
      ${!b && toRead.length ? `<div class="posters">${toRead.map(x => `<a href="books.html#${esc(x.id)}" title="${esc(x.title)}"><img src="${esc(x.cover)}" alt="" loading="lazy"></a>`).join('')}</div>` : ''}
    </div>`);
  }
  if (toWatch.length) {
    cards.push(`<div class="card c4"><div class="eyebrow">Хочу посмотреть <a class="more" href="films.html#to-watch">все →</a></div>
      <div class="posters">${toWatch.map(m => `<a href="films.html#${esc(m.id)}" title="${esc(m.title)}"><img src="${esc(m.poster)}" alt="" loading="lazy"></a>`).join('')}</div></div>`);
  }
  const watched = movies.filter(m => m.status === 'watched'), listened = lect.lectures.filter(l => l.status === 'listened');
  cards.push(`<div class="card c12"><div class="stats">
    <div><b>${watched.length}</b>фильмов посмотрел</div><div><b>${movies.filter(m => m.status === 'to-watch').length}</b>в планах</div>
    <div><b>${books.filter(b => b.status === 'read').length}</b>книг прочитал</div><div><b>${mixes.length}</b>миксов</div><div><b>${listened.length}</b>лекций прослушано</div><div><b>${fmtDur(listened.reduce((s, l) => s + (l.duration || 0), 0)).replace(' мин', '')}</b>часов лекций</div></div></div>`);
  document.getElementById('cards').innerHTML = cards.join('');
});
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Доброе утро</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --surface: #ffffff; --surface-2: #f2f2f4;
    --text: #1d1d1f; --text-2: #6e6e73; --text-3: #a1a1a6;
    --line: rgba(0,0,0,.08); --accent: #0071e3; --ok: #34c759;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
    --shadow-lg: 0 2px 8px rgba(0,0,0,.08), 0 24px 64px rgba(0,0,0,.18);
    --glass: rgba(250,250,250,.7);
    --photo-veil: linear-gradient(180deg, rgba(255,255,255,.2) 0%, rgba(250,250,250,.6) 50%, rgba(250,250,250,.97) 100%);
    --card: rgba(255,255,255,.66); --card-text: #1d1d1f; --card-text-2: rgba(29,29,31,.7); --card-text-3: rgba(29,29,31,.5);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --surface: #1c1c1e; --surface-2: #2c2c2e;
      --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #6e6e73;
      --line: rgba(255,255,255,.1); --accent: #2997ff; --ok: #30d158;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
      --shadow-lg: 0 2px 8px rgba(0,0,0,.5), 0 24px 64px rgba(0,0,0,.6);
      --glass: rgba(0,0,0,.55);
      --photo-veil: linear-gradient(180deg, rgba(0,0,0,.3) 0%, rgba(0,0,0,.6) 50%, rgba(0,0,0,.97) 100%);
      --card: rgba(22,22,24,.55); --card-text: #fff; --card-text-2: rgba(255,255,255,.72); --card-text-3: rgba(255,255,255,.48);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Inter, system-ui, sans-serif;
    background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.45; letter-spacing: -0.01em; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }

  .bar { position: sticky; top: 0; z-index: 20; background: var(--glass); border-bottom: 1px solid var(--line); }
  .bar-inner { max-width: 1180px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 20px; }
  .nav { display: flex; gap: 18px; flex-wrap: wrap; }

  /* Фотография — обложка выпуска: она стоит только вверху и растворяется в бумаге. Раньше снимок шёл
     через всю страницу, и белые плашки поверх него давали ту самую рябь. */
  .backdrop { position: absolute; inset: 0 0 auto; height: 380px; z-index: -2; background: var(--bg); overflow: hidden; }
  .backdrop .ph { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.4s ease; transform: scale(1.04); }
  .backdrop .ph.on { opacity: 1; }
  .backdrop .veil { position: absolute; inset: 0;
    background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 52%, transparent) 0%,
                                        color-mix(in srgb, var(--bg) 86%, transparent) 62%, var(--bg) 100%); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 44px 32px 110px; }
  .greet { margin-bottom: 26px; }
  .greet p { margin: 8px 0 0; font-size: 17px; }

  /* Главная делится надвое по смыслу, а не по весу (18.09.2026): слева день — дела, погода,
     самочувствие, чем занять свободное окно; справа полка — что послушать и почитать. На
     телефоне колонки складываются в одну, и день остаётся сверху — утром нужен именно он. */
  .page { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 0 48px; align-items: start; }
  .shelf { align-self: start; position: sticky; top: 96px; border-left: 1px solid var(--line); padding-left: 32px; }
  .shelf .shelf-head { font-family: var(--sans); font-size: 10.5px; font-weight: 500; letter-spacing: .17em;
    text-transform: uppercase; color: var(--text-3); padding-bottom: 10px; }
  .item { display: block; border-top: 1px solid var(--line); padding: 13px 0; color: var(--text); }
  .item:first-of-type { border-top: 1px solid var(--rule); }
  .item .eyebrow { margin-bottom: 7px; }
  .item h3 { font-family: var(--display); font-weight: 500; font-size: 16px; line-height: 1.2; margin: 0;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .item .sub { font-size: 12.5px; font-style: italic; color: var(--text-2); margin-top: 3px; }
  .item .note { font-size: 12.5px; line-height: 1.45; color: var(--text-2); margin: 7px 0 0;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .item .row { gap: 12px; }
  .item .img.sq { width: 56px; height: 56px; } .item .img.wide { width: 84px; height: 48px; } .item .img.book { width: 44px; height: 66px; }
  a.item:hover h3 { color: var(--accent); }
  .item .acts { display: flex; gap: 16px; margin-top: 9px; flex-wrap: wrap; align-items: center; }
  .item .acts button.btn { border: 0; background: none; padding: 0; color: var(--text-3); cursor: pointer; }
  .item .acts button.btn:hover { color: var(--text); }
  .item.gone { opacity: .4; pointer-events: none; }

  /* Колонка дня: заметки через волосяную линейку, без рамок и теней. */
  .cards { display: grid; grid-template-columns: repeat(12, 1fr); gap: 0 38px; }
  .card { grid-column: span 12; align-self: start; background: none; border: 0; border-top: 1px solid var(--rule);
    padding: 15px 0 28px; display: flex; flex-direction: column; gap: 10px; min-width: 0; color: var(--text); }
  a.card:hover { transform: none; }
  a.card:hover h2, .card h2 a:hover { color: var(--accent); }
  .card.c6 { grid-column: span 6; } .card.c4 { grid-column: span 4; } .card.c8 { grid-column: span 8; } .card.c12 { grid-column: span 12; }
  .card .eyebrow { display: flex; align-items: baseline; gap: 10px; }
  .card .eyebrow .more { margin-left: auto; }
  .card h2 { font-size: 23px; margin: 0; }
  .card .sub { color: var(--text-2); font-size: 14.5px; }

  .row { display: flex; gap: 16px; align-items: flex-start; min-width: 0; }
  a.row { margin: 0; padding: 0; }
  a.row:hover { background: none; }
  a.row:hover h2 { color: var(--accent); }
  .row .img { flex: 0 0 auto; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
  .row .img img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .img.sq { width: 84px; height: 84px; } .img.wide { width: 132px; height: 74px; } .img.book { width: 64px; height: 96px; }
  .row .txt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .row .txt h2 { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .prog { height: 2px; background: color-mix(in srgb, var(--text) 16%, transparent); overflow: hidden; margin-top: 6px; }
  .prog i { display: block; height: 100%; background: var(--accent); }

  /* Кнопки на полосе — не чёрные плашки (их набиралось восемь штук на экран), а подписи-отсылки. */
  .btn { align-self: flex-start; margin-top: 2px; display: inline-flex; align-items: center; gap: 8px;
    height: auto; padding: 0; background: none; color: var(--accent);
    font-family: var(--sans); font-size: 11.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }
  .btn:hover { text-decoration: underline; text-underline-offset: 4px; }
  .btn svg { width: 10px; height: 10px; }
  .card.art .acts { display: flex; gap: 20px; margin-top: 2px; flex-wrap: wrap; align-items: center; }
  .card.art .acts .btn { margin-top: 0; }
  .card.art .acts button.btn { border: 0; background: none; color: var(--text-3); cursor: pointer; }
  .card.art .acts button.btn:hover { background: none; color: var(--text); }
  .card.art.gone { opacity: .4; pointer-events: none; }
  .card.art .row { align-items: flex-start; }
  .card.art .thumb { flex: 0 0 auto; width: 148px; aspect-ratio: 4 / 3; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
  .card.art .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (max-width: 680px) { .card.art .thumb { width: 104px; } }

  /* Погода — строка выпуска: крупный градус антиквой, часы вдоль неё. */
  .card.wx .wxrow { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .wxicon { font-size: 26px; line-height: 1; }
  .wxtemp { font-family: var(--display); font-size: 36px; font-weight: 500; letter-spacing: -0.01em; line-height: 1; font-variant-numeric: tabular-nums; }
  .wxtxt { min-width: 0; }
  .wxtxt .t { font-size: 15px; }
  .wxtxt .s { font-size: 13px; font-style: italic; color: var(--text-2); margin-top: 1px; }
  .hours { display: flex; gap: 0; margin-left: auto; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .hours .hr { flex: 0 0 auto; min-width: 42px; text-align: center; padding: 2px 4px; border-left: 1px solid var(--line); }
  .hours .hr:first-child { border-left: 0; }
  .hours .hr.wet .t { color: var(--c2); }
  .hours .s { font-family: var(--sans); font-size: 9.5px; letter-spacing: .1em; color: var(--text-3); }
  .hours .ic { font-size: 13px; line-height: 1.4; }
  .hours .t { font-size: 12.5px; font-variant-numeric: tabular-nums; }
  @media (max-width: 900px) { .hours { margin-left: 0; width: 100%; } }

  /* Дела на сегодня: строка событий, прошедшие приглушены, текущее — киноварью. */
  .sc .chips { display: flex; gap: 6px 24px; flex-wrap: wrap; }
  .sc .ch { display: inline-flex; align-items: baseline; gap: 9px; font-size: 15.5px; }
  .sc .ch .tm { font-family: var(--sans); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--text-3); font-variant-numeric: tabular-nums; }
  .sc .ch.past { opacity: .42; }
  .sc .ch.now { font-weight: 600; }
  .sc .ch.now .tm { color: var(--accent); }
  .sc .ch.free-ev { font-style: italic; color: var(--text-2); }
  .sc .ch.empty { color: var(--text-2); }

  /* Чем занять окно: три колонки, разделённые линейками, как врезка на полосе. */
  .fit .picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 0; }
  .fit .pick { display: flex; gap: 12px; align-items: flex-start; min-width: 0; padding: 2px 24px; border-left: 1px solid var(--line); }
  .fit .pick:first-child { padding-left: 0; border-left: 0; }
  .fit .picks > :last-child { padding-right: 0; }
  a.fit-pick:hover .t { color: var(--accent); }
  .fit .pick .img { width: 66px; height: 50px; flex: 0 0 auto; overflow: hidden; background: var(--surface-2);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .fit .pick .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fit .pick .txt { min-width: 0; }
  .fit .pick .t { font-family: var(--display); font-size: 15px; font-weight: 500; line-height: 1.22;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .fit .pick .s { font-size: 12px; font-style: italic; color: var(--text-3); margin-top: 3px; }

  .card.lc h2 { font-size: 20px; }
  .card.lc .img.sq { width: 72px; height: 72px; } .card.lc .img.wide { width: 122px; height: 69px; }

  /* Well-being — заметка дня: это единственный на полосе настоящий текст, и набран он как текст. */
  .card .note { font-size: 14.5px; line-height: 1.5; color: var(--text-2); margin: 0; }
  .card.hl .note { font-size: 18.5px; line-height: 1.5; letter-spacing: 0; color: var(--text); margin: 0;
    font-style: normal; white-space: pre-wrap; }
  .stats { display: flex; gap: 28px; flex-wrap: wrap; font-family: var(--sans); font-size: 10.5px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); }
  .stats b { color: var(--text); font-family: var(--display); font-size: 22px; font-weight: 500; letter-spacing: 0;
    display: block; margin-bottom: 3px; text-transform: none; font-variant-numeric: tabular-nums; }
  .card.hl .stats b { font-size: 20px; }

  @media (max-width: 1080px) {
    .page { grid-template-columns: 1fr; gap: 0; }
    .shelf { position: static; border-left: 0; padding-left: 0; margin-top: 10px; }
    .shelf .shelf-head { padding-top: 26px; }
  }
  @media (max-width: 900px) {
    .card.c6, .card.c4, .card.c8 { grid-column: span 12; }
    .fit .picks { grid-template-columns: 1fr; }
    .fit .pick { padding: 10px 0; border-left: 0; border-top: 1px solid var(--line); }
    .fit .pick:first-child { border-top: 0; padding-top: 2px; }
  }
  @media (max-width: 640px) {
    .bar-inner { padding: 12px 16px; }
    .wrap { padding: 26px 16px 80px; } .cards { gap: 0 20px; margin-top: 6px; }
    .backdrop { height: 300px; }
    .card { padding: 13px 0 22px; } .card h2 { font-size: 20px; }
    .stats { gap: 14px 24px; } .stats b { font-size: 19px; }
    .img.sq { width: 72px; height: 72px; } .img.wide { width: 112px; height: 63px; }
    .card.hl .note { font-size: 17px; }
  }
/* Phone: the nav wraps onto a second row instead of pushing the page sideways (the sticky bar ended at «Еда»
   and the whole page scrolled horizontally in the BoW app). */
@media (max-width: 760px) {
  html, body { overflow-x: hidden; }
  .bar-inner { flex-wrap: wrap; }
  .nav { flex-wrap: wrap; gap: 6px 14px; font-size: 15px; }
}
</style>

<body>
<div class="backdrop"><div class="ph on" id="ph"></div><div class="veil"></div></div>
<header class="bar"><div class="bar-inner">
  <nav class="nav"><a href="index.html" class="on">Главная</a><a href="films.html">Фильмы</a><a href="books.html">Книги</a><a href="mixes.html">Миксы</a><a href="lectures.html">Лекции</a><a href="health.html">Well-being</a><a href="pantry.html">Еда</a><a href="spend.html">Траты</a><a href="reads.html">Читать</a><a href="french.html">Французский</a><a href="home.html">Дом</a></nav>
</div></header>

<main class="wrap">
  <div class="greet"><h1 id="greet">Доброе утро</h1><p id="date"></p></div>
  <div class="page">
    <div class="cards" id="cards"></div>
    <aside class="shelf" id="shelf"></aside>
  </div>
</main>

<script src="rec.js"></script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const { fmtDur } = Lect;
const h = new Date().getHours();
document.getElementById('greet').textContent = h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер';
document.getElementById('date').textContent = new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>';
// До девяти утра — спокойное: читать под ритмичный микс нельзя (тег calm в коллекции, mood у советов).
const MORNING_UNTIL = 9;
const isMorning = () => new Date().getHours() < MORNING_UNTIL;
const isCalm = m => m.mood === 'calm' || (m.tags || []).includes('calm');
const pick = (arr, n) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, n); };
const j = (url, fb) => fetch(url, { cache: 'no-store' }).then(r => r.ok ? r.json() : fb).catch(() => fb);

// Лекций на главной нет с 18.09.2026 (просьба пользователя): слушаются они только с телефона, где у них
// свой таб, а на сайте — свой раздел в верхней панели. Здесь они только в «чем занять окно», как вариант
// на вечер, — но это уже про свободное окно, а не про каталог.
Promise.all([j('mixes.json', []), j('/api/backgrounds', []), j('/api/weather', null), j('books.json', []), j('/api/health', null), j('/api/mix-recs', null), j('/api/reads', null), j('/api/schedule', null), j('/api/french', null), j('/api/fit', null)]).then(([mixes, bgs, wx, books, hl, recs, reads, sched, fr, fit]) => {
  if (bgs.length) document.getElementById('ph').style.backgroundImage = `url("${bgs[Math.floor(Math.random() * bgs.length)]}")`;
  // День — левая колонка, полка — правая.
  const cards = [], shelf = [];
  // Дела на сегодня — плашка над всем остальным: события Яндекс.Календаря (все календари, кроме чужих
  // тренировок — их отсеивает сервер) и свободные окна дня. Утром это первое, что нужно видеть.
  // Рабочий блок 10:00–18:00 стоит в календаре каждый будний день и делом не является: если кроме него
  // на сегодня ничего нет, плашки нет вовсе — пустая полоса «Работа» каждое утро не нужна.
  const ROUTINE = /^\s*работа\s*$/i;
  const schedCard = (sc) => {
    if (!sc || !(sc.events || []).some(e => !ROUTINE.test(e.title))) return '';
    const now = new Date();
    const chip = e => {
      const st = new Date(e.start), en = new Date(e.end);
      const on = !e.allday && st <= now && en > now;
      const cls = e.allday ? '' : en <= now ? 'past' : on ? 'now' : '';
      // У того, что идёт сейчас, видно и когда оно кончится, — остальное читается одним временем начала.
      const tm = e.allday ? 'весь день' : on ? `${e.from}–${e.to}` : e.from;
      return `<span class="ch ${cls} ${e.busy ? '' : 'free-ev'}"><span class="tm">${esc(tm)}</span>${esc(e.title)}</span>`;
    };
    const ahead = sc.events.filter(e => e.allday || new Date(e.end) > now);
    const more = [];
    if ((sc.free || []).length) more.push('свободно ' + sc.free.slice(0, 2).map(f => `${f.from}–${f.to}`).join(', '));
    if (!ahead.length && sc.tomorrow) more.push(`завтра с ${sc.tomorrow.from} — ${sc.tomorrow.title}`);
    return `<div class="card c12 sc"><div class="eyebrow">Дела на сегодня${more.length ? ` <span class="more">${esc(more.join(' · '))}</span>` : ''}</div>
      <div class="chips">${sc.events.map(chip).join('')}</div></div>`;
  };

  const sd = schedCard(sched);
  if (sd) cards.push(sd);

  // «Чем занять» — то, ради чего сайт вообще знает и календарь, и погоду, и длину каждой лекции:
  // не «что посмотреть вообще», а что целиком влезает в ближайшую дыру в дне. Считает /api/fit.
  const fitCard = (f) => {
    if (!f || !f.window || !(f.picks || []).length) return '';
    const w = f.window, wx = f.weather;
    const head = w.open ? `Свободно до ${esc(w.to)}` : `Свободно ${esc(w.from)}–${esc(w.to)}`;
    const more = [w.length, wx ? `${wx.icon} ${(wx.temp > 0 ? '+' : '') + wx.temp}°` : '',
      wx && wx.precip >= 20 ? `осадки ${wx.precip}%` : ''].filter(Boolean).join(' · ');
    const tile = p => {
      const inner = `<div class="img">${p.image ? `<img src="${esc(p.image)}" alt="" onerror="this.remove()">` : (p.kind === 'walk' && wx ? wx.icon : '')}</div>
        <div class="txt"><div class="t">${esc(p.title)}</div><div class="s">${esc(p.sub)}${p.fits === false ? ' · не влезет целиком' : ''}</div></div>`;
      // У прогулки ссылки нет: это не страница сайта, а совет выйти из дома.
      return p.url
        ? `<a class="pick fit-pick" href="${esc(p.url)}"${p.external ? ' target="_blank" rel="noopener"' : ''}>${inner}</a>`
        : `<div class="pick">${inner}</div>`;
    };
    return `<div class="card c12 fit"><div class="eyebrow">${head}${more ? ` <span class="more">${esc(more)}</span>` : ''}</div>
      <div class="picks">${f.picks.map(tile).join('')}</div></div>`;
  };
  // «Чем занять окно» встаёт после самочувствия: сначала день и я, потом план на вечер.
  const fitc = fitCard(fit);

  if (wx && wx.now) {
    const sign = t => (t > 0 ? '+' : '') + t + '°';
    const rainy = wx.hours.filter(h => h.day && (h.precipProb || 0) >= 40);
    const precip = wx.today.precipSum > 0 || wx.today.precipProbMax >= 40
      ? `${wx.today.precipSum > 0 ? wx.today.precipSum + ' мм' : 'осадки'}, ${wx.today.precipProbMax}%${rainy.length ? ` в ${rainy[0].time}–${rainy[rainy.length - 1].time}` : ''}`
      : 'без осадков';
    cards.push(`<div class="card c12 wx"><div class="wxrow">
        <span class="wxicon">${wx.now.icon}</span><span class="wxtemp">${sign(wx.now.temp)}</span>
        <div class="wxtxt"><div class="t">${esc(wx.now.condition)}, ощущается ${sign(wx.now.feels)}</div>
          <div class="s">${esc(wx.city)} · днём ${sign(wx.today.tmax)}, ночью ${sign(wx.today.tmin)} · ${wx.today.icon} ${precip} · ветер ${wx.now.wind} м/с</div></div>
        <div class="hours">${wx.hours.slice(0, 12).map(h => `<div class="hr ${(h.precipProb || 0) >= 40 ? 'wet' : ''}"><div class="s">${h.time.slice(0, 2)}</div><div class="ic">${h.icon}</div><div class="t">${sign(h.temp).replace('°', '')}</div></div>`).join('')}</div>
      </div></div>`);
  }
  // Well-being — самая длинная запись дня и единственная на странице настоящая проза, поэтому она в колонке
  // дня, а не на полке: утром читают её, а не список миксов.
  if (hl && (hl.review || hl.lastIngest)) {
    const hm = m => m == null ? '—' : `${Math.floor(m / 60)}ч${String(Math.round(m) % 60).padStart(2, '0')}`;
    const t = hl.days[0] || {}, a = hl.avg7 || {};
    // A note written during the night is not advice worth reading over breakfast; the server marks it stale.
    const note = hl.review && !hl.review.stale ? hl.review : null;
    const when = note ? new Date(note.ts) : null;
    const whenTxt = when ? (when.toDateString() === new Date().toDateString() ? '' : when.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ', ') + when.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
    const noteMore = whenTxt ? 'заметка ' + esc(whenTxt) : (hl.review ? 'свежей заметки ещё нет' : 'заметки пока нет');
    cards.push(`<a class="card c12 hl" href="health.html"><div class="eyebrow">Well-being <span class="more">${noteMore}</span></div>
      ${note ? `<p class="note">${esc(note.text)}</p>` : ''}
      <div class="stats"><div><b>${t.sleep ? hm(t.sleep.total) : '—'}</b>сон</div><div><b>${t.rhr ?? '—'}</b>пульс покоя</div><div><b>${t.hrv ?? '—'}</b>HRV</div>
        <div><b>${t.steps != null ? Math.round(t.steps).toLocaleString('ru-RU') : '—'}</b>шагов сегодня${a.steps ? ' · ср. ' + Math.round(a.steps).toLocaleString('ru-RU') : ''}</div>
        ${t.workouts && t.workouts.length ? `<div><b>${esc(t.workouts.map(w => w.ru).join(', '))}</b>тренировка</div>` : ''}</div></a>`);
  }
  if (fitc) cards.push(fitc);

  // ---------- полка: что послушать и почитать ----------
  const morning = isMorning();
  const recItems = (recs && recs.items) || [];
  const recPool = morning && recItems.some(isCalm) ? recItems.filter(isCalm) : recItems;
  const rec = recPool.find(r => !r.played) || recPool[0];
  const mixPool = morning && mixes.some(isCalm) ? mixes.filter(isCalm) : mixes;
  const mix = pick(mixPool, 1)[0];
  const mixItem = (m, eyebrow, more, reason) => `<a class="item" href="mixes.html#${encodeURIComponent(m.id)}">
      <div class="eyebrow">${eyebrow}${more ? ` <span class="more">${more}</span>` : ''}</div>
      <div class="row"><div class="img sq">${m.artwork ? `<img src="${esc(m.artwork)}" alt="">` : ''}</div>
        <div class="txt"><h3>${esc(m.title)}</h3><div class="sub">${esc(m.artist || '')} · ${fmtDur(m.duration)}</div></div></div>
      ${reason ? `<p class="note">${esc(reason)}</p>` : ''}</a>`;

  if (mix) shelf.push(mixItem(mix,
    morning && isCalm(mix) ? 'Под утреннее чтение' : 'Микс на сегодня',
    morning && isCalm(mix) ? 'спокойный' : 'случайный'));
  if (rec) shelf.push(mixItem(rec, 'Совет от Claude',
    rec.played ? 'уже включал' : (morning && isCalm(rec) ? 'спокойное' : ''), rec.reason));

  // Статья дня: ссылка ведёт в текст, а «Прочту»/«Мимо» — те же вердикты, что на странице «Читать»
  // (первую версию карточки без кнопок пользователь принял за отсутствие оценок вовсе).
  const artItem = (r) => {
    const art = ((r && r.items) || [])[0];
    if (!art) return '';
    const more = (r.items || []).length - 1;
    return `<div class="item art" data-id="${esc(art.id)}"><div class="eyebrow">Почитать <span class="more">${esc(art.source || '')}${art.minutes ? ' · ' + art.minutes + ' мин' : ''}</span></div>
      <div class="row">${art.image ? `<a class="img wide" href="${esc(art.url)}" target="_blank" rel="noopener"><img src="${esc(art.image)}" alt=""></a>` : ''}
        <div class="txt"><h3><a href="${esc(art.url)}" target="_blank" rel="noopener">${esc(art.title)}</a></h3></div></div>
      ${art.reason ? `<p class="note">${esc(art.reason)}${more > 0 ? ` · ещё ${more} на странице «Читать»` : ''}</p>` : ''}
      <div class="acts"><a class="btn" href="${esc(art.url)}" target="_blank" rel="noopener">Открыть</a><button class="btn" data-act="saved">Прочту</button><button class="btn" data-act="dismissed">Мимо</button></div></div>`;
  };
  const ai = artItem(reads);
  if (ai) shelf.push(ai);

  const reading = books.filter(b => b.status === 'reading');
  if (reading.length) {
    const b = reading[0];
    shelf.push(`<a class="item" href="books.html#${esc(b.id)}"><div class="eyebrow">Читаю${reading.length > 1 ? ` <span class="more">и ещё ${reading.length - 1}</span>` : ''}</div>
      <div class="row"><div class="img book">${b.cover ? `<img src="${esc(b.cover)}" alt="">` : ''}</div>
        <div class="txt"><h3>${esc(b.title)}</h3><div class="sub">${esc(b.author || '')}</div></div></div></a>`);
  }

  // Французский: то, чем заниматься сегодня, и сколько слов ждёт повторения.
  const frenchItem = (f) => {
    if (!f) return '';
    const m = (f.items || []).find(x => x.lesson) || (f.items || [])[0];
    const due = (f.due || []).length;
    if (!m && !due) return '';
    const les = (m && m.lesson) || {};
    const n = (les.quiz || []).length, w = (les.words || []).length;
    const more = due ? `${due} ${due % 10 === 1 && due % 100 !== 11 ? 'слово' : 'слов'} к повторению` : '';
    if (!m) return `<a class="item" href="french.html"><div class="eyebrow">Французский${more ? ` <span class="more">${esc(more)}</span>` : ''}</div>
      <div class="row"><div class="txt"><h3>Повторить слова</h3><div class="sub">материалы кончились — на странице можно попросить новые</div></div></div></a>`;
    return `<a class="item" href="french.html"><div class="eyebrow">Французский${more ? ` <span class="more">${esc(more)}</span>` : ''}</div>
      <div class="row"><div class="img ${m.kind === 'video' ? 'wide' : 'sq'}">${m.image ? `<img src="${esc(m.image)}" alt="" onerror="this.remove()">` : ''}</div>
        <div class="txt"><h3>${esc(m.title)}</h3><div class="sub">${esc([m.source, m.minutes ? m.minutes + ' мин' : '', les.builtAt ? `${w} слов · тест из ${n}` : 'разбор собирается'].filter(Boolean).join(' · '))}</div></div></div></a>`;
  };
  const fi = frenchItem(fr);
  if (fi) shelf.push(fi);

  document.getElementById('cards').innerHTML = cards.join('');
  document.getElementById('shelf').innerHTML = shelf.length
    ? `<div class="shelf-head">Полка</div>${shelf.join('')}` : '';
  document.getElementById('shelf').addEventListener('click', async e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const card = b.closest('.item.art'); card.classList.add('gone');
    try {
      const out = await fetch('/api/read/' + encodeURIComponent(card.dataset.id), {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ verdict: b.dataset.act }),
      }).then(async r => { if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status); return r.json(); });
      const next = artItem(out.reads);
      if (next) card.outerHTML = next; else card.remove();
    } catch (err) { card.classList.remove('gone'); b.textContent = 'Ошибка: ' + err.message; }
  });
});
</script>
</body>
</html>

<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --surface: #ffffff; --surface-2: #f2f2f4;
    --text: #1d1d1f; --text-2: #6e6e73; --text-3: #a1a1a6;
    --line: rgba(0,0,0,.08); --accent: #0071e3; --ok: #34c759; --warn: #ff9f0a;
    --glass: rgba(250,250,250,.7);
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
    --paper: #f6f2ea; --paper-2: #ece6da; --ink: #2b2925; --ink-2: rgba(43,41,37,.45); --ink-3: rgba(43,41,37,.18);
    --sky: #cbd6e4; --sky-2: #e8eef5; --blend: multiply;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --surface: #1c1c1e; --surface-2: #2c2c2e;
      --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #6e6e73;
      --line: rgba(255,255,255,.1); --accent: #2997ff; --ok: #30d158; --warn: #ffd60a;
      --glass: rgba(0,0,0,.55);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
      --paper: #17171a; --paper-2: #1f1f23; --ink: #d9d3c6; --ink-2: rgba(217,211,198,.45); --ink-3: rgba(217,211,198,.16);
      --sky: #16223a; --sky-2: #223354; --blend: screen;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Inter, system-ui, sans-serif;
    background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.45; letter-spacing: -0.01em; }
  a { color: inherit; text-decoration: none; }
  .bar { position: sticky; top: 0; z-index: 20; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
  .bar-inner { max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .nav { display: flex; gap: 18px; font-size: 17px; letter-spacing: -0.02em; flex-wrap: wrap; }
  .nav a { color: var(--text-3); font-weight: 600; }
  .nav a.on { color: var(--text); }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 36px 32px 80px; }
  .head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
  .head h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; margin: 0; line-height: 1.1; }
  .head .sub { color: var(--text-2); font-size: 14px; }
  .head .sub.err { color: var(--warn); }
  .layout { display: grid; grid-template-columns: minmax(0, 8fr) minmax(300px, 4fr); gap: 18px; align-items: start; }
  .card { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 22px; min-width: 0; }
  .card .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-2); font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .card .eyebrow .more { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--text-3); }

  /* --- the sketch --- */
  .sketch { padding: 0; overflow: hidden; background: var(--paper); border-radius: 26px; position: relative; }
  .sketch svg { display: block; width: 100%; height: auto; }
  .sketch .cap { position: absolute; left: 20px; bottom: 14px; font-size: 12px; color: var(--ink-2); font-style: italic; letter-spacing: 0; pointer-events: none; }
  .ink { fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .ink .thin { stroke-width: 1.1; }
  .ink .faint { stroke: var(--ink-2); stroke-width: 1; }
  .ink .hatch { stroke: var(--ink-3); stroke-width: .9; }
  .ink .fill { fill: var(--ink-3); stroke: none; }
  .ink .paper2 { fill: var(--paper-2); }
  .sky { fill: var(--sky); } .sky2 { fill: var(--sky-2); }
  .glow { mix-blend-mode: var(--blend); pointer-events: none; }
  .glow circle, .glow path { transition: opacity .6s ease; }
  .hit { cursor: pointer; }
  .hit .halo { fill: transparent; stroke: transparent; stroke-width: 1.5; stroke-dasharray: 4 5; transition: stroke .2s; }
  .hit:hover .halo, .hit:focus-visible .halo { stroke: var(--accent); }
  .hit:focus { outline: none; }
  .fx .lampglow { animation: flicker 1.1s infinite ease-in-out; }
  .fx .lampglow.b { animation-duration: 1.4s; animation-delay: .35s; }
  @keyframes flicker { 0% { opacity: .55 } 18% { opacity: .95 } 33% { opacity: .62 } 51% { opacity: 1 } 67% { opacity: .7 } 84% { opacity: .9 } 100% { opacity: .55 } }
  .disabled { opacity: .5; pointer-events: none; }

  /* --- controls --- */
  .panel { display: flex; flex-direction: column; gap: 18px; }
  .dev { display: flex; flex-direction: column; gap: 14px; }
  .dev .top { display: flex; align-items: center; gap: 14px; }
  .dev .top .t { flex: 1; min-width: 0; }
  .dev .top h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; margin: 0; line-height: 1.2; }
  .dev .top .s { color: var(--text-2); font-size: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .sw { position: relative; width: 52px; height: 32px; border-radius: 999px; background: color-mix(in srgb, var(--text) 18%, transparent); border: 0; cursor: pointer; flex: 0 0 auto; transition: background .25s; padding: 0; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); transition: transform .25s cubic-bezier(.2,.7,.2,1); }
  .sw.on { background: var(--ok); }
  .sw.on::after { transform: translateX(20px); }
  .sw:disabled { opacity: .4; cursor: default; }
  .sl { display: grid; grid-template-columns: 72px 1fr 58px; align-items: center; gap: 12px; font-size: 13px; color: var(--text-2); }
  .sl output { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 999px; background: var(--track, color-mix(in srgb, var(--text) 14%, transparent)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 1px 4px rgba(0,0,0,.3); margin-top: -9px; cursor: pointer; }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 999px; background: var(--track, color-mix(in srgb, var(--text) 14%, transparent)); }
  input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 1px 4px rgba(0,0,0,.3); cursor: pointer; }
  #warm { --track: linear-gradient(90deg, #ff9a3c, #ffd9a6 45%, #ffffff 70%, #c9dcff); }
  #bri { --track: linear-gradient(90deg, color-mix(in srgb, var(--text) 10%, transparent), color-mix(in srgb, var(--text) 45%, transparent)); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: inherit; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); border-radius: 999px; padding: 7px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: transform .15s; }
  .chip:hover { transform: translateY(-1px); }
  .chip:active { transform: scale(.97); }
  .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--c, #ccc); box-shadow: 0 0 0 1px rgba(0,0,0,.08) inset; }
  .sched { margin-top: 14px; font-size: 12.5px; color: var(--text-3); }
  .grp { margin-top: 16px; }
  .grp:first-child { margin-top: 0; }
  .grp .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); font-weight: 600; margin-bottom: 8px; }
  @media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } .layout > * { min-width: 0; max-width: 100%; } }
  @media (max-width: 640px) {
    .bar-inner { padding: 12px 16px; } .nav { font-size: 15px; gap: 6px 14px; }
    .wrap { padding: 24px 16px 70px; } .head h1 { font-size: 28px; } .card { padding: 18px; border-radius: 20px; }
  }
</style>

    <g class="hit" id="hitB" data-dev="lamps" tabindex="0" role="button" aria-label="Бра у картины: переключить">
      <rect x="900" y="82" width="64" height="214" rx="20" class="halo"/>
      <path d="M932 136 L932 290" /><circle cx="932" cy="218" r="9"/><path d="M932 218 L914 218 L914 202 L932 202" class="thin"/>
      <path d="M916 134 L922 98 Q932 90 942 98 L948 134 Q932 142 916 134 Z" class="paper2"/>
      <path d="M916 134 L922 98 Q932 90 942 98 L948 134 Q932 142 916 134 Z" />
      <path d="M922 98 Q932 104 942 98" class="faint"/><path d="M932 290 L926 298 M932 290 L938 298" class="thin"/>
    </g>
    <!-- wall socket -->
    <rect x="640" y="326" width="14" height="14" rx="2" class="thin"/>
  </g>
</svg>
      <div class="cap">кухня · нажми на лампу</div>
    </section>

    <aside class="panel" id="panel">
      <div class="card dev" id="d-lamps">
        <div class="top"><div class="t"><h2>Бра у картины</h2><div class="s" id="lampsSub">…</div></div><button class="sw" id="swLamps" aria-label="Бра вкл/выкл"></button></div>
        <label class="sl">Яркость <input type="range" id="bri" min="1" max="100" value="43"><output id="briOut">43%</output></label>
        <label class="sl">Тепло <input type="range" id="warm" min="2000" max="6500" step="50" value="2300"><output id="warmOut">2300 K</output></label>
      </div>
      <div class="card dev" id="d-plug">
        <div class="top"><div class="t"><h2>Varmblixt</h2><div class="s" id="plugSub">…</div></div><button class="sw" id="swPlug" aria-label="Varmblixt вкл/выкл"></button></div>
      </div>
      <div class="card" id="d-scenes">
        <div class="grp"><div class="lbl">Сцены</div><div class="chips" id="scenes"></div></div>
        <div class="grp" id="fxGrp" hidden><div class="lbl">Живой огонь</div><div class="chips" id="effects"></div></div>
        <div class="sched" id="sched"></div>
      </div>
    </aside>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const SCENE_COLOR = { cozy: '#ffc27a', golden: '#ffd9a0', amber: '#ffa330', candle: '#ff6e0f', sunset: '#ff460a', tv: '#bec8ff', green: '#50ff78', sleepy: '#ffb15a', night: '#ffb15a' };
let S = { devices: {}, effect: null };       // last known state
let localUntil = 0;                          // while dragging a slider, server polls must not fight the hand
let timer = null;

// --- colour maths: what the bulb reports → what the sketch glows with
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function kelvinRgb(k) {
  const t = clamp(k, 1000, 12000) / 100;
  const r = t <= 66 ? 255 : 329.698727446 * Math.pow(t - 60, -0.1332047592);
  const g = t <= 66 ? 99.4708025861 * Math.log(t) - 161.1195681661 : 288.1221695283 * Math.pow(t - 60, -0.0755148492);
  const b = t >= 66 ? 255 : t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
  return [r, g, b].map(v => Math.round(clamp(v, 0, 255)));
}
function xyRgb(x, y) {
  if (!y) return [255, 200, 120];
  const z = 1 - x - y, Y = 1, X = (Y / y) * x, Z = (Y / y) * z;
  let r = X * 1.656492 - Y * 0.354851 - Z * 0.255038, g = -X * 0.707196 + Y * 1.655397 + Z * 0.036152, b = X * 0.051713 - Y * 0.121364 + Z * 1.011530;
  const gam = v => v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
  let out = [r, g, b].map(v => gam(Math.max(0, v)));
  const m = Math.max(...out) || 1;
  return out.map(v => Math.round(clamp(v / m, 0, 1) * 255));
}
const hex = ([r, g, b]) => '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
function lampColor(d) {
  if (!d) return '#ffd27a';
  if (d.color_mode === 'xy' && d.color && d.color.x != null) return hex(xyRgb(d.color.x, d.color.y));
  if (d.color_temp) return hex(kelvinRgb(1e6 / d.color_temp));
  return '#ffd27a';
}
function setGrad(id, color) { document.querySelectorAll(`#${id} stop`).forEach(s => s.setAttribute('stop-color', color)); }

// --- render
function render() {
  const D = S.devices || {}, a = D.lamp, b = D.lamp2, p = D.plug;
  const off = !S.error && (a || b);
  const lamp = a || b;                                  // the group is shown by the bulb that answered
  const on = !!lamp && lamp.state === 'ON';
  const bri = lamp && lamp.brightness != null ? Math.round(lamp.brightness / 254 * 100) : null;
  const kelvin = lamp && lamp.color_temp ? Math.round(1e6 / lamp.color_temp / 50) * 50 : null;
  const colorMode = lamp && lamp.color_mode === 'xy';

  for (const [dev, gid, colId, coneId] of [[a, 'glowA', 'gA', 'coneA'], [b, 'glowB', 'gB', 'coneB']]) {
    const g = $(gid);
    const isOn = dev && dev.state === 'ON';
    const c = lampColor(dev);
    setGrad(colId, c); setGrad(coneId, c);
    g.setAttribute('opacity', isOn ? (0.35 + 0.65 * ((dev.brightness ?? 200) / 254)).toFixed(2) : 0);
  }
  $('glow').classList.toggle('fx', !!S.effect);
  const plugOn = p && p.state === 'ON';
  $('glowV').setAttribute('opacity', plugOn ? 0.9 : 0);
  $('discV').setAttribute('fill', plugOn ? 'url(#disc)' : '');
  $('discV').setAttribute('class', plugOn ? '' : 'paper2');

  $('swLamps').classList.toggle('on', on);
  $('swLamps').disabled = !lamp;
  $('lampsSub').textContent = !lamp ? (S.error ? 'нет связи' : 'не отвечают')
    : !on ? 'выключены'
    : S.effect ? `${effName(S.effect)} · ${bri}%`
    : colorMode ? `${bri}% · цвет` : `${bri}% · ${kelvin} K${a && b && a.state !== b.state ? ' · одна из двух' : ''}`;
  if (Date.now() > localUntil) {
    if (bri != null) { $('bri').value = bri; $('briOut').textContent = bri + '%'; }
    if (kelvin) { $('warm').value = kelvin; $('warmOut').textContent = kelvin + ' K'; }
  }
  $('d-lamps').classList.toggle('disabled', !lamp);

  $('swPlug').classList.toggle('on', !!plugOn);
  $('swPlug').disabled = !p;
  $('plugSub').textContent = !p ? (S.error ? 'нет связи' : 'не отвечает')
    : plugOn ? (p.power ? `горит · ${Math.round(p.power)} Вт` : 'розетка включена') + (p.voltage ? ` · ${Math.round(p.voltage)} В` : '') : 'выключена';
  $('d-plug').classList.toggle('disabled', !p);

  document.querySelectorAll('#effects .chip').forEach(c => c.classList.toggle('on', c.dataset.id === S.effect));
  document.querySelectorAll('#scenes .chip').forEach(c => c.classList.toggle('on', !S.effect && on && c.dataset.id === matchScene(lamp)));
  const st = $('status');
  st.classList.toggle('err', !!S.error);
  st.textContent = S.error ? 'mini не отвечает: ' + S.error : (lamp || p) ? `обновлено ${new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}` : 'устройства молчат';
}
const effName = id => ({ fire: 'камин', candlelight: 'свеча', torch: 'факел' }[id] || id);
// The chip lights up only when the bulb reports exactly what the scene asked for.
function matchScene(d) {
  if (!d || !S.sceneMap) return null;
  for (const [id, p] of Object.entries(S.sceneMap)) {
    if (Math.abs((d.brightness ?? -1) - p.brightness) > 2) continue;
    if (p.color_temp && d.color_mode === 'color_temp' && Math.abs(d.color_temp - p.color_temp) <= 2) return id;
    if (p.color && d.color_mode === 'xy') { const c = xyRgb(d.color.x, d.color.y), t = [p.color.r, p.color.g, p.color.b]; if (c.every((v, i) => Math.abs(v - t[i]) < 40)) return id; }
  }
  return null;
}

// --- talk to the server
const post = (path, body) => fetch('/api/home/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
  .then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.status); return j; })
  .catch(e => { $('status').textContent = 'не вышло: ' + e.message; $('status').classList.add('err'); });
function reloadSoon(ms = 1800) { clearTimeout(timer); timer = setTimeout(load, ms); }
async function load() {
  try {
    const r = await fetch('/api/home', { cache: 'no-store' });
    if (r.status === 401) { location.href = '/login?next=/home.html'; return; }
    const j = await r.json();
    S = { ...S, ...j };
    if (j.scenes && !S.sceneMap) buildChips(j);
  } catch (e) { S.error = e.message; }
  render();
  clearTimeout(timer); timer = setTimeout(load, document.visibilityState === 'visible' ? 8000 : 60000);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });

const SCENE_PAYLOAD = { cozy: { brightness: 110, color_temp: 435 }, golden: { brightness: 180, color_temp: 370 }, amber: { brightness: 140, color: { r: 255, g: 163, b: 48 } },
  candle: { brightness: 70, color: { r: 255, g: 110, b: 15 } }, sunset: { brightness: 120, color: { r: 255, g: 70, b: 10 } }, tv: { brightness: 60, color: { r: 190, g: 200, b: 255 } },
  green: { brightness: 70, color: { r: 80, g: 255, b: 120 } }, sleepy: { brightness: 25, color_temp: 500 }, night: { brightness: 8, color_temp: 500 } };
function buildChips(j) {
  S.sceneMap = Object.fromEntries((j.scenes || []).map(s => [s.id, SCENE_PAYLOAD[s.id] || {}]));
  $('scenes').innerHTML = (j.scenes || []).map(s => `<button class="chip" data-id="${s.id}" style="--c:${SCENE_COLOR[s.id] || '#ddd'}"><i></i>${s.title}</button>`).join('');
  $('scenes').querySelectorAll('.chip').forEach(c => c.onclick = () => {
    const p = SCENE_PAYLOAD[c.dataset.id];
    // show it before the bulbs confirm: the transition takes seconds, the eye wants the answer now
    for (const k of ['lamp', 'lamp2']) if (S.devices[k]) S.devices[k] = { ...S.devices[k], state: 'ON', ...p, color_mode: p.color ? 'xy' : 'color_temp', color: p.color ? rgbXy(p.color) : S.devices[k].color };
    S.effect = null; render();
    post('scene/' + c.dataset.id).then(() => reloadSoon(3500));
  });
  const fx = j.effects || [];
  $('fxGrp').hidden = !fx.length;
  $('effects').innerHTML = fx.map(e => `<button class="chip" data-id="${e.id}" style="--c:#ff7a1e"><i></i>${e.title}</button>`).join('');
  $('effects').querySelectorAll('.chip').forEach(c => c.onclick = () => {
    const stop = S.effect === c.dataset.id;
    S.effect = stop ? null : c.dataset.id;
    for (const k of ['lamp', 'lamp2']) if (S.devices[k] && !stop) S.devices[k] = { ...S.devices[k], state: 'ON' };
    render();
    post('effect/' + (stop ? 'off' : c.dataset.id)).then(() => reloadSoon(2500));
  });
  $('sched').textContent = j.schedule ? 'По расписанию: ' + j.schedule : '';
}
function rgbXy({ r, g, b }) {   // only to preview a colour scene before the bulb reports back
  const lin = v => { v /= 255; return v > 0.04045 ? Math.pow((v + 0.055) / 1.055, 2.4) : v / 12.92; };
  const R = lin(r), G = lin(g), B = lin(b);
  const X = R * 0.4124 + G * 0.3576 + B * 0.1805, Y = R * 0.2126 + G * 0.7152 + B * 0.0722, Z = R * 0.0193 + G * 0.1192 + B * 0.9505;
  const s = X + Y + Z || 1; return { x: X / s, y: Y / s };
}

// --- toggles
function toggleLamps() {
  const lamp = S.devices.lamp || S.devices.lamp2; if (!lamp) return;
  const to = lamp.state === 'ON' ? 'OFF' : 'ON';
  for (const k of ['lamp', 'lamp2']) if (S.devices[k]) S.devices[k] = { ...S.devices[k], state: to };
  if (to === 'OFF') S.effect = null;
  render();
  post('lamps', { state: to, transition: 1 }).then(() => reloadSoon());
}
function togglePlug() {
  const p = S.devices.plug; if (!p) return;
  const to = p.state === 'ON' ? 'OFF' : 'ON';
  S.devices.plug = { ...p, state: to }; render();
  post('plug', { state: to }).then(() => reloadSoon());
}
$('swLamps').onclick = toggleLamps;
$('swPlug').onclick = togglePlug;
for (const id of ['hitA', 'hitB', 'hitV']) {
  const el = $(id), fn = id === 'hitV' ? togglePlug : toggleLamps;
  el.addEventListener('click', fn);
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } });
}

// --- sliders: the sketch follows the hand at once, the bulb gets one message per pause
let slideT = null;
function slide(payload) {
  localUntil = Date.now() + 2500;
  for (const k of ['lamp', 'lamp2']) if (S.devices[k]) S.devices[k] = { ...S.devices[k], state: 'ON', ...payload, ...(payload.color_temp ? { color_mode: 'color_temp' } : {}) };
  S.effect = null; render();
  clearTimeout(slideT);
  slideT = setTimeout(() => post('lamps', { state: 'ON', transition: 0.4, ...payload }).then(() => reloadSoon(2500)), 220);
}
$('bri').addEventListener('input', e => { const v = +e.target.value; $('briOut').textContent = v + '%'; slide({ brightness: Math.max(1, Math.round(v * 254 / 100)) }); });
$('warm').addEventListener('input', e => { const v = +e.target.value; $('warmOut').textContent = v + ' K'; slide({ color_temp: Math.round(1e6 / v) }); });

// The window: evening outside after seven, morning before.
(function sky() {
  const h = new Date().getHours();
  if (h >= 19 || h < 7) { document.documentElement.style.setProperty('--sky', '#182640'); document.documentElement.style.setProperty('--sky-2', '#26395c'); $('citywin').style.stroke = '#ffd98a'; $('citywin').style.strokeWidth = '2'; }
})();
load();
</script>
</body>

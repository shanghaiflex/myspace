<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Французский</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇫🇷</text></svg>">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --surface: #ffffff; --surface-2: #f2f2f4;
    --text: #1d1d1f; --text-2: #6e6e73; --text-3: #a1a1a6;
    --line: rgba(0,0,0,.08); --accent: #0071e3; --accent-text: #fff; --ok: #34a853; --bad: #e0483b;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
    --shadow-lg: 0 2px 8px rgba(0,0,0,.08), 0 24px 64px rgba(0,0,0,.18);
    --glass: rgba(250,250,250,.78); --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --surface: #1c1c1e; --surface-2: #2c2c2e; --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #6e6e73;
      --line: rgba(255,255,255,.1); --accent: #2997ff; --glass: rgba(0,0,0,.72); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Inter, system-ui, sans-serif;
    background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.45; letter-spacing: -0.01em; }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  .bar { position: sticky; top: 0; z-index: 20; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
  .bar-inner { max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .nav { display: flex; gap: 18px; font-size: 17px; letter-spacing: -0.02em; }
  .nav a { color: var(--text-3); font-weight: 600; }
  .nav a.on { color: var(--text); }
  .spacer { flex: 1; }
  .control { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 10px; padding: 0 6px 0 12px; height: 34px; font-size: 13px; color: var(--text-2); }
  .control select { border: 0; background: transparent; outline: 0; color: var(--text); font-weight: 600; padding: 6px 4px; -webkit-appearance: none; appearance: none; cursor: pointer; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 36px 32px 80px; }
  .head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; }
  .head h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; margin: 0; line-height: 1.1; }
  .head .meta { color: var(--text-2); font-size: 14.5px; }

  /* строка дня: календарь решает не тему, а размер занятия */
  .day { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 4px 0 30px; font-size: 13.5px; color: var(--text-2); }
  .day .pill { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; box-shadow: var(--shadow); }
  .day .pill.hot { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); color: var(--text); }

  .sec { margin: 0 0 44px; }
  .sechead { display: flex; align-items: baseline; gap: 12px; margin: 0 0 14px; }
  .sechead h2 { font-size: 19px; font-weight: 650; letter-spacing: -0.02em; margin: 0; }
  .sechead .meta { color: var(--text-3); font-size: 12.5px; }
  .sechead .spacer { flex: 1; }
  .sechead button { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; padding: 4px 2px; }
  .sechead button:disabled { color: var(--text-3); cursor: default; }

  .arts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .art { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
    transition: opacity .18s, transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s ease; }
  .art:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .art.gone { opacity: 0; transform: scale(.98); pointer-events: none; }
  .art .pic { display: block; aspect-ratio: 16 / 10; background: var(--surface-2); overflow: hidden; position: relative; cursor: pointer; }
  /* Картинка лежит НАД заглушкой: .ph позиционирована абсолютно и без этого закрывала бы превью. */
  .art .pic img { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; z-index: 1; }
  .art .pic .ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; color: var(--text-3); font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, var(--surface-2)), var(--surface-2) 70%); }
  .art .pic .tag { position: absolute; z-index: 2; left: 10px; top: 10px; background: rgba(0,0,0,.6); color: #fff; border-radius: 999px; padding: 3px 9px; font-size: 11.5px; font-weight: 600; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .art .body { padding: 14px 18px 16px; display: flex; flex-direction: column; flex: 1; }
  .art .src { font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
  .art h3 { margin: 5px 0 0; font-size: 17px; font-weight: 620; line-height: 1.28; letter-spacing: -0.01em; cursor: pointer; }
  .art .why { margin: 8px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--text-2); }
  .art .acts { display: flex; gap: 8px; margin-top: 14px; }
  .art .acts button { border: 1px solid var(--line); background: var(--surface-2); color: var(--text); border-radius: 8px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .art .acts .take { background: var(--accent); border-color: transparent; color: var(--accent-text); }

  .deck { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .deck .big { border: 0; background: var(--accent); color: var(--accent-text); border-radius: 12px; padding: 13px 22px; font-size: 15px; font-weight: 600; box-shadow: var(--shadow); }
  .deck .big:disabled { background: var(--surface-2); color: var(--text-3); box-shadow: none; }
  .deck .note { color: var(--text-2); font-size: 13.5px; }
  .words-peek { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .words-peek span { background: var(--surface-2); border-radius: 999px; padding: 4px 11px; font-size: 13px; }
  .words-peek span i { color: var(--text-3); font-style: normal; }

  .weak { display: flex; flex-wrap: wrap; gap: 8px; }
  .weak .t { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; box-shadow: var(--shadow); }
  .weak .t b { font-weight: 600; }
  .weak .t i { font-style: normal; color: var(--bad); }
  .mist { list-style: none; padding: 0; margin: 14px 0 0; }
  .mist li { font-size: 13px; color: var(--text-2); margin: 6px 0; line-height: 1.4; }
  .mist s { color: var(--text-3); }
  .mist b { color: var(--text); font-weight: 600; }
  .done { list-style: none; padding: 0; margin: 0; }
  .done li { font-size: 13.5px; color: var(--text-2); margin: 7px 0; }
  .empty { color: var(--text-3); font-size: 13.5px; }

  .scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: grid; place-items: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity .22s ease; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet { width: 100%; max-width: 720px; max-height: min(90vh, 960px); overflow: auto; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-lg);
    padding: 26px 28px 30px; position: relative; transform: translateY(14px) scale(.98); transition: transform .25s cubic-bezier(.2,.7,.2,1); }
  .scrim.open .sheet { transform: none; }
  .sheet h2 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; padding-right: 44px; }
  .sheet .sub { color: var(--text-2); font-size: 13.5px; margin-bottom: 16px; }
  .close { position: absolute; top: 16px; right: 16px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--text-2); display: grid; place-items: center; font-size: 15px; line-height: 1; }
  .vid { aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #000; margin-bottom: 16px; }
  .vid iframe { width: 100%; height: 100%; border: 0; display: block; }
  .intro { font-size: 14.5px; line-height: 1.55; color: var(--text-2); margin: 0 0 16px; }
  .words { display: grid; gap: 8px; margin: 0 0 6px; }
  .w { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 4px 12px; padding: 10px 13px; background: var(--surface-2); border-radius: 10px; font-size: 14.5px; }
  .w b { font-weight: 600; }
  .w .ru { color: var(--text-2); }
  .w .ex { grid-column: 1 / -1; font-size: 12.5px; color: var(--text-3); font-style: italic; }
  .qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .dots { display: flex; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dot.ok { background: var(--ok); } .dot.no { background: var(--bad); } .dot.now { background: var(--accent); }
  /* В журнальной палитре --accent и --bad — одна и та же киноварь, поэтому «текущий вопрос»
     отличается от «ответил неверно» не цветом, а формой: колечко вместо заливки. */
  .dot.now { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }
  .qhead .n { font-size: 12.5px; color: var(--text-3); }
  .q { font-size: 17.5px; font-weight: 600; margin: 0 0 16px; line-height: 1.4; }
  .opts { display: grid; gap: 8px; }
  .opts button { text-align: left; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); border-radius: 10px; padding: 12px 15px; font-size: 14.5px; }
  .opts button.ok { background: color-mix(in srgb, var(--ok) 22%, var(--surface-2)); border-color: var(--ok); }
  .opts button.no { background: color-mix(in srgb, var(--bad) 18%, var(--surface-2)); border-color: var(--bad); }
  .opts button:disabled { cursor: default; }
  .gap { display: flex; gap: 8px; }
  .gap input { flex: 1; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 12px 15px; font-size: 15px; outline: 0; }
  .gap input:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .exp { margin-top: 14px; font-size: 13.5px; line-height: 1.5; color: var(--text-2); background: var(--surface-2); border-radius: 10px; padding: 11px 13px; }
  .exp b { color: var(--text); }
  .btnrow { display: flex; gap: 10px; margin-top: 20px; align-items: center; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--surface-2); color: var(--text); border-radius: 10px; padding: 10px 18px; font-size: 14.5px; }
  .btn.prim { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }
  .btnrow .hint { font-size: 13px; color: var(--text-3); }
  .score { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; margin: 6px 0 2px; }
  .score small { font-size: 15px; color: var(--text-3); font-weight: 500; letter-spacing: 0; }
  .saved { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); opacity: 0; z-index: 60; background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 500; transition: all .2s ease; pointer-events: none; }
  .saved.on { opacity: 1; transform: translate(-50%, 0); }

  /* --- урок и перевод: материал, которого нет ни в одной ленте --- */
  /* Приехали не из ленты: ни превью, ни издания у них нет, поэтому вместо картинки — наборная
     плашка с темой. Так карточка всё равно читается как карточка, а не как дыра в сетке. */
  .art.drill .pic { display: grid; place-items: center; padding: 22px; text-align: center; cursor: pointer;
    background: color-mix(in srgb, var(--accent) 8%, var(--surface)); border-bottom: 1px solid var(--line); }
  .art.drill .pic .kindline { font-family: var(--sans); font-size: 10.5px; font-weight: 500; letter-spacing: .17em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .art.drill .pic .topic { font-family: var(--display); font-size: 22px; line-height: 1.22; color: var(--text); }

  /* объяснение урока: части с заголовками и примеры парами */
  .sec-l { border-top: 1px solid var(--line); padding-top: 13px; margin: 18px 0 0; }
  .sec-l h4 { margin: 0 0 7px; font-family: var(--display); font-size: 17.5px; font-weight: 600; }
  .sec-l p { margin: 0; font-size: 14.5px; line-height: 1.55; }
  .exl { display: grid; gap: 7px; margin: 11px 0 0; }
  .exl .e { background: var(--surface-2); padding: 9px 12px; }
  .exl .e .fr { font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .exl .e .ru { font-size: 13px; color: var(--text-2); margin-top: 2px; }

  /* озвучка: системный синтезатор. Кнопки нет вовсе, если французского голоса в системе нет. */
  .spk { border: 1px solid var(--line); background: var(--surface-2); color: var(--text-2);
    width: 24px; height: 24px; padding: 0; font-size: 12px; line-height: 1; flex: none; }
  .spk.big { width: auto; height: auto; padding: 12px 20px; font-size: 14.5px; color: var(--text); }
  .w b .spk { margin-left: 6px; vertical-align: middle; }

  /* собери фразу / составь пары */
  .slot { min-height: 54px; border: 1px dashed var(--line); padding: 10px 12px; margin-bottom: 12px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .slot .ph { color: var(--text-3); font-size: 13.5px; font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .slot button, .chips button { border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    padding: 9px 13px; font-size: 14.5px; }
  .slot button:disabled, .chips button:disabled { cursor: default; }
  .pairs { display: grid; gap: 8px; }
  .pairs .row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
  .pairs .row .l { background: var(--surface-2); padding: 10px 12px; font-size: 14.5px; font-weight: 600;
    display: flex; align-items: center; gap: 8px; }
  .pairs .row .r { border: 1px dashed var(--line); padding: 10px 12px; font-size: 14.5px; color: var(--text-3); cursor: pointer; }
  .pairs .row .r.set { border-style: solid; color: var(--text); }
  .pairs .row.ok .r { border-color: var(--ok); }
  .pairs .row.no .r { border-color: var(--bad); }
  .gap.wide { flex-direction: column; align-items: stretch; }
  .gap.wide .btn { align-self: flex-start; }
  .qsub { font-size: 13.5px; color: var(--text-2); margin: -8px 0 14px; }

  @media (max-width: 760px) {
    html, body { overflow-x: hidden; }
    .bar-inner { padding: 12px 16px; gap: 10px; flex-wrap: wrap; }
    .nav { flex-wrap: wrap; gap: 6px 14px; font-size: 15px; }
    .wrap { padding: 24px 16px 60px; }
    .head h1 { font-size: 28px; }
    .arts { grid-template-columns: 1fr; }
    .scrim { padding: 0; align-items: end; }
    .sheet { border-radius: 22px 22px 0 0; max-height: 94vh; padding: 22px 18px 28px; }
    .w { grid-template-columns: 1fr; }
  }
</style>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let toastTimer;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2200); }
const fmtDay = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }); };
const plural = (n, a, b, c) => n % 10 === 1 && n % 100 !== 11 ? a : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? b : c;

// Та же нормализация, что в french.py: страница показывает результат сразу, сервер потом
// пересчитывает его сам по сохранённому тесту — сходиться они должны на одном правиле.
// Кириллица оставлена намеренно: ответы бывают и русскими, а без неё любые два русских
// ответа нормализовались в пустую строку и сходились друг с другом.
const norm = s => String(s ?? '').replace(/[’ʼ]/g, "'").toLowerCase()
  .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9а-я' ]+/g, ' ').replace(/\s+/g, ' ').trim();

// Озвучка — системный синтезатор речи. Французский голос есть не везде (в Firefox на маке его
// надо доустановить), поэтому всё звуковое сначала спрашивает canSpeak(): нет голоса — нет ни
// кнопок «прослушать», ни заданий на слух, и страница работает как раньше.
let VOICE = null;
function pickVoice() {
  try {
    const all = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
    VOICE = all.find(v => /^fr/i.test(v.lang) && v.localService) || all.find(v => /^fr/i.test(v.lang)) || null;
  } catch { VOICE = null; }
}
const canSpeak = () => !!VOICE;
function speak(text, rate) {
  if (!VOICE || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.voice = VOICE; u.lang = VOICE.lang || 'fr-FR'; u.rate = rate || 0.92;
    speechSynthesis.speak(u);
  } catch { /* синтезатор — украшение, его отказ ничего не ломает */ }
}
const spk = (t, cls) => canSpeak() ? `<button class="spk${cls ? ' ' + cls : ''}" data-say="${esc(t)}" title="Произнести">♪</button>` : '';
if (window.speechSynthesis) {
  pickVoice();
  // Голоса приезжают асинхронно: если французский появился уже после отрисовки, перерисуем —
  // иначе кнопок звука не будет до перезагрузки страницы.
  speechSynthesis.onvoiceschanged = () => { const had = canSpeak(); pickVoice(); if (!had && canSpeak() && DB) render(DB); };
}
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let DB = null;      // ответ /api/french
let L = null;       // текущий урок
let C = null;       // текущая сессия карточек

// ---------------------------------------------------------------- страница
function render(db) {
  DB = db || {};
  const st = DB.stats || {};
  const lvl = $('#level');
  lvl.innerHTML = (DB.levels || ['A1','A2','B1','B2','C1']).map(l => `<option${l === DB.level ? ' selected' : ''}>${l}</option>`).join('');
  $('#meta').textContent = [
    st.cards ? st.cards + ' ' + plural(st.cards, 'слово', 'слова', 'слов') + ' в колоде' : '',
    DB.accuracy != null ? 'точность ' + DB.accuracy + '%' : '',
    DB.streak ? DB.streak + ' ' + plural(DB.streak, 'день', 'дня', 'дней') + ' подряд' : '',
    st.done ? 'пройдено ' + st.done : '',
  ].filter(Boolean).join(' · ') || 'первое занятие впереди — открой любой материал';

  const items = DB.items || [];
  $('#items').innerHTML = items.map(matCard).join('');
  $('#itemsEmpty').hidden = !!items.length;
  const nDrill = items.filter(isDrill).length, nFeed = items.length - nDrill;
  $('#itemsMeta').textContent = [
    nFeed ? nFeed + ' ' + plural(nFeed, 'материал', 'материала', 'материалов') : '',
    nDrill ? nDrill + ' ' + plural(nDrill, 'упражнение', 'упражнения', 'упражнений') : '',
    DB.updatedAt ? 'подобрано ' + fmtDay(DB.updatedAt) : '',
  ].filter(Boolean).join(' · ');

  const due = new Set(DB.due || []);
  const cards = DB.cards || [];
  $('#cardsMeta').textContent = cards.length ? cards.length + ' в колоде' : '';
  $('#deck').innerHTML = cards.length
    ? `<button class="big" id="study"${due.size ? '' : ' disabled'}>${due.size ? 'Повторить ' + due.size + ' ' + plural(due.size, 'слово', 'слова', 'слов') : 'Всё повторено'}</button>
       <div class="note">${due.size ? 'по одному вопросу на слово, минуты три' : nextDue(cards)}</div>`
    : `<div class="empty">Слова появятся сами: они уезжают сюда из разбора, когда материал пройден.</div>`;
  $('#peek').innerHTML = cards.slice(-14).reverse().map(c =>
    `<span>${esc(c.fr)} <i>${esc(c.ru)}</i></span>`).join('');

  const weak = DB.weak || [];
  $('#weakSec').hidden = !weak.length;
  $('#weak').innerHTML = weak.map(w => `<div class="t"><b>${esc(w.tag)}</b> — <i>${w.wrong}</i> из ${w.n}</div>`).join('');
  $('#mist').innerHTML = (DB.mistakes || []).map(m =>
    `<li>${esc(m.q)} → <s>${esc(m.given || '—')}</s> · <b>${esc(m.expected)}</b></li>`).join('');

  const done = (DB.history || []).filter(h => h.verdict === 'done');
  $('#doneSec').hidden = !done.length;
  $('#done').innerHTML = done.slice(0, 15).map(h =>
    `<li><a href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title)}</a> · ${esc(h.source || '')}${h.score != null && h.total ? ` · тест ${h.score} из ${h.total}` : ''}</li>`).join('');
}

function nextDue(cards) {
  const days = cards.map(c => c.due).filter(Boolean).sort();
  return days.length ? 'следующие слова — ' + fmtDay(days[0]) : '';
}

const isDrill = m => m.kind === 'lesson' || m.kind === 'translation';
const KINDLINE = { lesson: 'Урок', translation: 'Перевод', video: '▶ видео', article: 'статья' };
// Названия типов заданий: карточка честно говорит, что внутри, — «5 заданий» ничего не обещает,
// а «перевод, пары, на слух» обещает разное.
const QNAME = { choice: 'выбор', gap: 'пропуск', translate: 'перевод', order: 'порядок слов',
                match: 'пары', listen: 'на слух' };

function matCard(m) {
  const les = m.lesson || {};
  const n = (les.quiz || []).length, w = (les.words || []).length;
  const kinds = [...new Set((les.quiz || []).map(q => QNAME[q.type] || q.type))].join(', ');
  if (isDrill(m)) {
    return `<article class="art drill" data-id="${esc(m.id)}">
      <div class="pic" data-open="1">
        <div><div class="kindline">${esc(KINDLINE[m.kind])}</div><div class="topic">${esc(m.topic || m.title)}</div></div>
      </div>
      <div class="body">
        <div class="src">${esc([m.source, m.minutes ? m.minutes + ' мин' : ''].filter(Boolean).join(' · '))}</div>
        <h3 data-open="1">${esc(m.title)}</h3>
        ${m.why ? `<div class="why">${esc(m.why)}</div>` : ''}
        <div class="why" style="color:var(--text-3)">${w ? `${w} ${plural(w, 'слово', 'слова', 'слов')} · ` : ''}${n} ${plural(n, 'задание', 'задания', 'заданий')}${kinds ? ': ' + esc(kinds) : ''}</div>
        <div class="acts">
          <button class="take" data-act="open">Заниматься</button>
          <button data-act="dismissed">Мимо</button>
        </div>
      </div>
    </article>`;
  }
  // Заглушка лежит под картинкой всегда: файла превью может не быть (french/img/ — данные машины),
  // и тогда img просто убирает себя, открывая подпись источника вместо битой иконки.
  const pic = `<div class="ph">${esc(m.source || '')}</div>`
    + (m.image ? `<img src="${esc(m.image)}" alt="" loading="lazy" onerror="this.remove()">` : '');
  const sub = [m.source, m.minutes ? m.minutes + ' мин' : '', m.hard].filter(Boolean).join(' · ');
  return `<article class="art" data-id="${esc(m.id)}">
    <div class="pic" data-open="1">${pic}<span class="tag">${m.kind === 'video' ? '▶ видео' : 'статья'}</span></div>
    <div class="body">
      <div class="src">${esc(sub)}</div>
      <h3 data-open="1">${esc(m.title)}</h3>
      ${m.why ? `<div class="why">${esc(m.why)}</div>` : ''}
      <div class="why" style="color:var(--text-3)">${les.builtAt ? `${w} ${plural(w, 'слово', 'слова', 'слов')} · ${n} ${plural(n, 'задание', 'задания', 'заданий')}${kinds ? ': ' + esc(kinds) : ''}` : 'разбор ещё не собрался'}</div>
      <div class="acts">
        <button class="take" data-act="open">Заниматься</button>
        <button data-act="dismissed">Мимо</button>
      </div>
    </div>
  </article>`;
}

async function load() {
  try {
    const db = await fetch('/api/french', { cache: 'no-store' }).then(r => r.ok ? r.json() : null);
    render(db || {});   // сервер без API (статика) — страница честно показывает пустые секции
    return db;
  } catch { render({}); return null; }
}

// ---------------------------------------------------------------- день из календаря
async function day() {
  try {
    const p = await fetch('/api/schedule', { cache: 'no-store' }).then(r => r.ok ? r.json() : null);
    if (!p) return;
    const bits = [];
    const now = new Date(p.now || Date.now());
    const hm = s => { const [h, m] = String(s || '').split(':').map(Number); const d = new Date(now); d.setHours(h || 0, m || 0, 0, 0); return d; };
    const lesson = (p.events || []).find(e => /франц/i.test(e.title || ''));
    if (lesson && hm(lesson.to) > now) bits.push(`<span class="pill hot">Занятие сегодня в ${esc(lesson.from)} — успей повторить слова</span>`);
    const free = (p.free || [])[0];
    if (free) bits.push(`<span class="pill">Свободно ${esc(free.from)}–${esc(free.to)} · ${free.minutes >= 60 ? 'хватит на видео с разбором' : 'хватит на слова'}</span>`);
    else if (p.tomorrow) bits.push(`<span class="pill">Сегодня плотно — завтра начинается в ${esc(p.tomorrow.from)}</span>`);
    $('#day').innerHTML = bits.join('');
    $('#day').hidden = !bits.length;
  } catch { /* календарь — украшение: нет его, страница работает как раньше */ }
}

// ---------------------------------------------------------------- занятие
function openLesson(id) {
  const m = (DB.items || []).find(x => x.id === id);
  if (!m) return;
  const quiz = ((m.lesson || {}).quiz) || [];
  // Задания «на слух» показываются только там, где в системе есть французский голос: без него
  // вопрос либо невозможен, либо превращается в подарок. Номер задания при этом остаётся
  // настоящим — по нему сервер пересчитывает ответ по сохранённому тесту.
  const qs = quiz.map((q, i) => ({ q, i })).filter(x => x.q.type !== 'listen' || canSpeak());
  L = { m, qs, step: 'study', qi: 0, answers: [], given: null, checked: false, hint: false };
  drawLesson();
  $('#scrim').classList.add('open');
}

function closeSheet() {
  $('#scrim').classList.remove('open');
  $('#sheet').innerHTML = '';
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch {}
  L = null; C = null;
}

const lastAnswer = () => L.answers[L.answers.length - 1];

function sheetHead(m) {
  const sub = isDrill(m)
    ? [m.source, m.topic, m.minutes ? m.minutes + ' мин' : ''].filter(Boolean).join(' · ')
    : [m.source, m.minutes ? m.minutes + ' мин' : '', m.hard].filter(Boolean).join(' · ');
  return `<button class="close" id="x">✕</button>
    <h2>${esc(m.title)}</h2>
    <div class="sub">${esc(sub)}</div>`;
}

function drawLesson() {
  const m = L.m, les = m.lesson || {}, qs = L.qs;
  const head = sheetHead(m);

  if (L.step === 'study') {
    let media = '';
    if (m.kind === 'video') {
      media = `<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${esc(m.id.slice(3))}?rel=0" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="origin"></iframe></div>`;
    } else if (m.kind === 'article') {
      media = `${m.image ? `<div class="vid" style="aspect-ratio:16/7"><img src="${esc(m.image)}" alt="" style="width:100%;height:100%;object-fit:cover"></div>` : ''}
         <p class="intro">${esc(m.summary || '')}</p>`;
    }
    // Урок объясняет частями: правило, случаи, частая ошибка — и у каждой части свои примеры.
    const sections = (les.sections || []).map(sec => `<section class="sec-l">
        ${sec.h ? `<h4>${esc(sec.h)}</h4>` : ''}
        <p>${esc(sec.text)}</p>
        ${(sec.ex || []).length ? `<div class="exl">${sec.ex.map(e =>
          `<div class="e"><div class="fr">${esc(e.fr)}${spk(e.fr)}</div>${e.ru ? `<div class="ru">${esc(e.ru)}</div>` : ''}</div>`).join('')}</div>` : ''}
      </section>`).join('');
    const words = (les.words || []).map(w =>
      `<div class="w"><b>${esc(w.fr)}${spk(w.fr)}</b><div class="ru">${esc(w.ru)}</div>${w.ex ? `<div class="ex">${esc(w.ex)}</div>` : ''}</div>`).join('');
    const go = qs.length
      ? `<button class="btn prim" data-go="quiz">${isDrill(m) ? 'Начать' : 'Проверить себя'} · ${qs.length} ${plural(qs.length, 'задание', 'задания', 'заданий')}</button>`
      : '<button class="btn prim" data-go="finish">Готово</button>';
    $('#sheet').innerHTML = head + media
      + (les.intro ? `<p class="intro">${esc(les.intro)}</p>` : '')
      + sections
      + (words ? `<div class="words"${sections ? ' style="margin-top:18px"' : ''}>${words}</div>` : '')
      + `<div class="btnrow">${go}
          ${m.url ? `<a class="btn" href="${esc(m.url)}" target="_blank" rel="noopener">Открыть ${m.kind === 'video' ? 'на YouTube' : 'статью'}</a>` : ''}
         </div>`;
    return;
  }

  if (L.step === 'quiz') return drawQuiz(head);

  // итог
  const quiz = les.quiz || [];
  const ok = L.answers.filter(a => a.ok).length, total = L.answers.length;
  const wrong = L.answers.filter(a => !a.ok);
  const words = (les.words || []).length;
  $('#sheet').innerHTML = head
    + `<div class="score">${ok} <small>из ${total}</small></div>`
    + (wrong.length
      ? `<ul class="mist">${wrong.map(a => `<li>${esc(quiz[a.i] ? quiz[a.i].q : '')} → <s>${esc(a.shown)}</s> · <b>${esc(a.right)}</b></li>`).join('')}</ul>`
      : `<p class="intro">Ни одной ошибки.</p>`)
    + `<p class="intro">${words ? words + ' ' + plural(words, 'слово уедет', 'слова уедут', 'слов уедут') + ' в повторение' : ''}${wrong.length ? ' · ошибки уйдут в следующий подбор' : ''}</p>`
    + `<div class="btnrow"><button class="btn prim" data-go="finish">Готово</button><span class="hint">материал уедет в «Пройдено»</span></div>`;
}

// ---------------------------------------------------------------- задания
// Шесть типов. Выбор и пары проверяются на месте и на сервере одинаково (индекс, перестановка),
// остальные — по тексту. У открытого перевода судья я: правильных переводов у фразы больше,
// чем влезает в accept, поэтому есть «всё равно верно» — сервер этот флаг честно засчитывает.
function initQ() {
  const q = L.qs[L.qi].q;
  L.checked = false; L.given = null; L.hint = false;
  if (q.type === 'order') { L.tokens = shuffle(String(q.answer).split(/\s+/)); L.order = []; }
  if (q.type === 'match') { L.pairs = q.pairs.map(() => null); L.ruOrder = shuffle(q.pairs.map((_, i) => i)); L.pick = null; }
}

const acceptsAnswer = (v, q) => [q.answer, ...(q.accept || [])].map(norm).includes(norm(v));

function drawQuiz(head) {
  const q = L.qs[L.qi].q, done = L.checked, a = done ? lastAnswer() : null;
  const dots = L.qs.map((_, i) => {
    const got = L.answers.find(x => x.qi === i);
    return `<span class="dot${got ? (got.ok ? ' ok' : ' no') : i === L.qi ? ' now' : ''}"></span>`;
  }).join('');

  let body = '', right = '';
  if (q.type === 'choice') {
    body = `<div class="opts">${q.options.map((o, i) => {
      let cls = '';
      if (done) cls = i === q.answer ? ' ok' : (i === L.given ? ' no' : '');
      return `<button data-opt="${i}"${done ? ' disabled' : ''} class="${cls.trim()}">${esc(o)}</button>`;
    }).join('')}</div>`;
  } else if (q.type === 'match') {
    const used = new Set(L.pairs.filter(v => v != null));
    body = `<div class="pairs">${q.pairs.map((p, i) => {
        const v = L.pairs[i];
        const cls = done ? (v === i ? ' ok' : ' no') : (L.pick === i ? ' on' : '');
        return `<div class="row${cls}"><div class="l">${esc(p.fr)}${spk(p.fr)}</div>
          <div class="r${v != null ? ' set' : ''}"${done ? '' : ` data-slot="${i}"`}>${v != null ? esc(q.pairs[v].ru) : '—'}</div></div>`;
      }).join('')}</div>
      ${done ? '' : `<div class="chips" style="margin-top:12px">${L.ruOrder.filter(j => !used.has(j)).map(j =>
        `<button data-chip="${j}">${esc(q.pairs[j].ru)}</button>`).join('')}</div>`}
      ${done || L.pairs.some(v => v == null) ? '' : '<div class="btnrow"><button class="btn prim" data-check="1">Проверить</button></div>'}`;
    if (done && !a.ok) right = q.pairs.map(p => `${p.fr} — ${p.ru}`).join(' · ');
  } else if (q.type === 'order') {
    const used = new Set(L.order);
    body = `<div class="slot">${L.order.length
        ? L.order.map((t, k) => `<button${done ? ' disabled' : ` data-unslot="${k}"`}>${esc(L.tokens[t])}</button>`).join('')
        : '<span class="ph">нажимай слова по порядку</span>'}</div>
      ${done ? '' : `<div class="chips">${L.tokens.map((t, i) => used.has(i) ? '' : `<button data-token="${i}">${esc(t)}</button>`).join('')}</div>`}
      ${done || !L.order.length ? '' : '<div class="btnrow"><button class="btn prim" data-check="1">Проверить</button></div>'}`;
    if (done && !a.ok) right = q.answer;
  } else {
    const wide = q.type === 'translate';
    const play = q.type === 'listen'
      ? `<div class="btnrow"><button class="btn spk big" data-say="${esc(q.say)}">♪ Прослушать</button><span class="hint">можно сколько угодно раз</span></div>` : '';
    body = play + `<div class="gap${wide ? ' wide' : ''}">
        <input id="gap" placeholder="${q.type === 'translate' ? 'переведи на французский' : 'впиши по-французски'}" autocomplete="off"
          autocapitalize="off" spellcheck="false" value="${esc(L.given || '')}"${done ? ' disabled' : ''}>
        ${done ? '' : '<button class="btn prim" data-check="1">Проверить</button>'}</div>`;
    if (done) right = q.answer;
  }

  const hint = q.hint && !done
    ? (L.hint ? `<div class="exp">${esc(q.hint)}</div>` : `<div class="btnrow"><button class="btn" data-hint="1">Подсказка</button></div>`)
    : '';
  const rightBlock = right
    ? `<div class="exp"><b>${a && a.ok ? 'Верно' : 'Правильно'}:</b> ${esc(right)}${spk(right)}</div>` : '';
  const said = done && q.type === 'listen' ? `<div class="exp"><b>Фраза:</b> ${esc(q.say)}</div>` : '';
  const selfBtn = done && !a.ok && q.type === 'translate'
    ? '<button class="btn" data-self-ok="1">Всё равно верно</button>' : '';

  $('#sheet').innerHTML = head
    + `<div class="qhead"><div class="dots">${dots}</div><div class="n">${L.qi + 1} из ${L.qs.length} · ${esc(QNAME[q.type] || q.type)}${q.tag ? ' · ' + esc(q.tag) : ''}</div></div>
       <div class="q">${esc(q.q)}</div>`
    + body + hint + said + rightBlock
    + (done && q.explain ? `<div class="exp">${esc(q.explain)}</div>` : '')
    + (done ? `<div class="btnrow"><button class="btn prim" data-go="next">${L.qi + 1 < L.qs.length ? 'Дальше' : 'Итог'}</button>${selfBtn}</div>` : '');

  const inp = $('#gap');
  if (inp && !done) { inp.focus(); inp.onkeydown = e => { if (e.key === 'Enter') checkCurrent(); }; }
  if (q.type === 'listen' && !done) speak(q.say);
}

function answer(given, shown, ok, rightText) {
  L.given = given; L.checked = true;
  L.answers.push({ qi: L.qi, i: L.qs[L.qi].i, given, shown, ok, right: rightText, self: false });
  drawLesson();
}

function checkCurrent() {
  const q = L.qs[L.qi].q;
  if (q.type === 'match') {
    if (L.pairs.some(v => v == null)) return;
    const shown = L.pairs.map((v, i) => `${q.pairs[i].fr} — ${q.pairs[v].ru}`).join(' · ');
    return answer(L.pairs.join(','), shown, L.pairs.every((v, i) => v === i),
                  q.pairs.map(p => `${p.fr} — ${p.ru}`).join(' · '));
  }
  if (q.type === 'order') {
    const given = L.order.map(i => L.tokens[i]).join(' ');
    return answer(given, given || '—', acceptsAnswer(given, q), q.answer);
  }
  const v = (($('#gap') || {}).value || '').trim();
  answer(v, v || '—', acceptsAnswer(v, q), q.answer);
}

function markSelf() {
  const a = lastAnswer();
  if (!a || a.ok) return;
  a.ok = true; a.self = true;     // сервер знает этот флаг и засчитывает его только у перевода
  drawLesson();
}

async function finishLesson(verdict) {
  const m = L.m;
  const body = { verdict, answers: L.answers.map(a => ({ i: a.i, given: a.given, self: a.self })) };
  closeSheet();
  try {
    const out = await fetch('/api/french/' + encodeURIComponent(m.id), {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    }).then(async r => { if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status); return r.json(); });
    render(out.french);
    if (verdict === 'dismissed') toast('Понял, такого больше не предлагаю');
    else toast(out.total ? `${out.score} из ${out.total} · слов в колоду: ${out.cards}` : `Слов в колоду: ${out.cards}`);
    if (out.job === 'running') { toast('Готовлю следующее — пара минут'); watchJob(); }
  } catch (e) { toast('Ошибка: ' + e.message); }
}

// ---------------------------------------------------------------- карточки
// Режимов пять, и коробка решает, какой по силам: в первых это узнавание, дальше вспоминание
// и набор руками. Пример из разбора даёт слово в контексте, синтезатор — на слух. Выбор
// случайный из подходящего: одна и та же карточка одним и тем же жестом перестаёт учить.
const MODE_NAME = { recognize: 'узнавание', recall: 'вспоминание', type: 'набрать',
                    cloze: 'в контексте', listen: 'на слух', 'listen-type': 'на слух, набрать' };

function clozeOf(c) {
  if (!c.ex || !c.fr) return null;
  const core = String(c.fr).replace(/^(le |la |les |l'|un |une |des |se |s'|à |de |du )/i, '').trim();
  const stem = core.split(/[\s']/)[0];
  if (stem.length < 4) return null;
  const head = stem.slice(0, Math.max(4, stem.length - 2)).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('[^\\s]*' + head + '[^\\s]*', 'i');
  const hit = String(c.ex).match(re);
  if (!hit) return null;
  return { text: String(c.ex).replace(re, '___'), answer: hit[0].replace(/[.,;:!?»«"()]/g, '') };
}

function pickMode(c) {
  const box = c.box || 1;
  const pool = box <= 2 ? ['recognize', 'recognize', 'recall'] : ['recall', 'type', 'type'];
  if (clozeOf(c)) pool.push('cloze');
  if (canSpeak()) pool.push(box <= 2 ? 'listen' : 'listen-type');
  return pool[Math.floor(Math.random() * pool.length)];
}

function startCards() {
  const due = new Set(DB.due || []);
  const queue = (DB.cards || []).filter(c => due.has(c.id));
  if (!queue.length) return;
  C = { queue, i: 0, results: [], checked: false, given: null, again: [], mode: null };
  drawCard();
  $('#scrim').classList.add('open');
}

function drawCard() {
  if (C.i >= C.queue.length) {
    // ошибся — спросим ещё раз в конце, и уже другим режимом
    if (C.again.length) { C.queue = C.again; C.again = []; C.i = 0; C.mode = null; C.opts = null; C.said = false; C.checked = false; C.given = null; }
    else return finishCards();
  }
  const c = C.queue[C.i];
  if (!C.mode) { C.mode = pickMode(c); C.cloze = C.mode === 'cloze' ? clozeOf(c) : null; C.given = null; C.checked = false; }
  const mode = C.mode;
  const typed = mode === 'type' || mode === 'cloze' || mode === 'listen-type';

  let prompt = '', sub = '', body = '';
  if (typed) {
    prompt = mode === 'cloze' ? esc(C.cloze.text) : (mode === 'listen-type' ? 'Что ты услышал?' : esc(c.ru));
    if (mode === 'cloze') sub = 'впиши пропущенное · ' + esc(c.ru);
    if (mode === 'type') sub = 'впиши по-французски';
    const right = mode === 'cloze' ? C.cloze.answer : c.fr;
    body = (mode === 'listen-type' ? `<div class="btnrow"><button class="btn spk big" data-say="${esc(c.fr)}">♪ Прослушать</button></div>` : '')
      + `<div class="gap"><input id="cardgap" placeholder="по-французски" autocomplete="off" autocapitalize="off"
          spellcheck="false" value="${esc(C.given || '')}"${C.checked ? ' disabled' : ''}>
         ${C.checked ? '' : '<button class="btn prim" data-cardcheck="1">Проверить</button>'}</div>`
      + (C.checked ? `<div class="exp"><b>${C.ok ? 'Верно' : 'Правильно'}:</b> ${esc(right)}${spk(right)}</div>` : '');
  } else {
    // выбор: варианты набираем из соседних карточек колоды
    const back = mode === 'recall';
    const field = back ? 'fr' : 'ru';
    if (!C.opts) {
      const pool = (DB.cards || []).filter(x => x.id !== c.id && x[field] && x[field] !== c[field]);
      const others = [];
      while (others.length < 3 && pool.length) others.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      C.opts = shuffle([c, ...others].map(x => x[field]));
      C.right = C.opts.indexOf(c[field]);
    }
    prompt = mode === 'listen' ? '♪' : esc(back ? c.ru : c.fr);
    if (mode === 'listen') sub = 'послушай и выбери перевод';
    body = (mode === 'listen' ? `<div class="btnrow"><button class="btn spk big" data-say="${esc(c.fr)}">♪ Прослушать</button></div>` : '')
      + (C.opts.length > 1
        ? `<div class="opts">${C.opts.map((o, i) => {
            let cls = '';
            if (C.checked) cls = i === C.right ? 'ok' : (i === C.given ? 'no' : '');
            return `<button data-card="${i}"${C.checked ? ' disabled' : ''} class="${cls}">${esc(o)}</button>`;
          }).join('')}</div>`
        : `<div class="btnrow"><button class="btn prim" data-self="1">Помню</button><button class="btn" data-self="0">Не помню</button></div>`);
  }

  const n = C.results.length + 1, total = C.results.length + C.queue.length - C.i + C.again.length;
  const selfBtn = C.checked && typed && !C.ok ? '<button class="btn" data-cardself="1">Засчитать</button>' : '';
  $('#sheet').innerHTML = `<button class="close" id="x">✕</button>
    <h2>Слова</h2><div class="sub">${n} из ${total} · ${esc(MODE_NAME[mode])}${c.fromTitle ? ' · из «' + esc(c.fromTitle) + '»' : ''}</div>
    <div class="q">${prompt}${mode === 'recognize' ? spk(c.fr) : ''}</div>
    ${sub ? `<div class="qsub">${sub}</div>` : ''}
    ${body}
    ${C.checked && c.ex && mode !== 'cloze' ? `<div class="exp">${esc(c.ex)}</div>` : ''}
    ${C.checked && !typed ? `<div class="exp">${esc(c.fr)} — ${esc(c.ru)}${spk(c.fr)}</div>` : ''}
    ${C.checked ? `<div class="btnrow"><button class="btn prim" data-go="card-next">Дальше</button>${selfBtn}</div>` : ''}`;

  const inp = $('#cardgap');
  if (inp && !C.checked) { inp.focus(); inp.onkeydown = e => { if (e.key === 'Enter') checkCard(); }; }
  if ((mode === 'listen' || mode === 'listen-type') && !C.checked && !C.said) { C.said = true; speak(c.fr); }
}

function answerCard(ok, given) {
  C.checked = true; C.given = given; C.ok = ok;
  const shown = C.opts && given != null ? C.opts[given] : (typeof given === 'string' ? given : '');
  // Ответ записывается один раз: повтор той же карточки в конце сессии не должен чинить оценку —
  // ошибся значит ошибся, коробка падает в первую.
  if (!C.results.some(r => r.id === C.queue[C.i].id)) {
    C.results.push({ id: C.queue[C.i].id, correct: ok, given: shown, mode: C.mode });
  }
  if (!ok) C.again.push(C.queue[C.i]);
  drawCard();
}

function checkCard() {
  const c = C.queue[C.i];
  const v = (($('#cardgap') || {}).value || '').trim();
  const right = C.mode === 'cloze' ? C.cloze.answer : c.fr;
  answerCard(norm(v) === norm(right), v);
}

function markCardSelf() {
  if (!C || !C.checked || C.ok) return;
  C.ok = true;
  const r = C.results.find(x => x.id === C.queue[C.i].id);
  if (r) r.correct = true;
  C.again = C.again.filter(x => x.id !== C.queue[C.i].id);
  drawCard();
}

function nextCard() {
  C.i++; C.checked = false; C.given = null; C.mode = null; C.opts = null; C.said = false; C.ok = false;
  drawCard();
}

async function finishCards() {
  const results = C.results;
  closeSheet();
  if (!results.length) return;
  try {
    const out = await fetch('/api/french/cards', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ results }),
    }).then(r => r.json());
    render(out.french);
    toast(`${out.correct} из ${out.seen} · осталось повторить ${out.due}`);
  } catch (e) { toast('Ошибка: ' + e.message); }
}

// ---------------------------------------------------------------- события
document.addEventListener('click', async e => {
  const sayBtn = e.target.closest('[data-say]');
  if (sayBtn) { speak(sayBtn.dataset.say); return; }
  if (e.target.id === 'x' || e.target === $('#scrim')) return closeSheet();
  if (e.target.id === 'study') return startCards();

  // ---- задания урока
  if (L && L.step === 'quiz') {
    const q = L.qs[L.qi].q;
    const opt = e.target.closest('button[data-opt]');
    if (opt && !L.checked) {
      const i = +opt.dataset.opt;
      return answer(i, q.options[i], i === q.answer, q.options[q.answer]);
    }
    const token = e.target.closest('button[data-token]');
    if (token && !L.checked) { L.order.push(+token.dataset.token); return drawLesson(); }
    const unslot = e.target.closest('button[data-unslot]');
    if (unslot && !L.checked) { L.order.splice(+unslot.dataset.unslot, 1); return drawLesson(); }
    const chip = e.target.closest('button[data-chip]');
    if (chip && !L.checked) {
      // Перевод летит в выбранную строку, а если строку не выбирали — в первую пустую:
      // заполнять подряд удобно, но пары не обязаны идти по порядку.
      const to = (L.pick != null && L.pairs[L.pick] == null) ? L.pick : L.pairs.indexOf(null);
      if (to >= 0) { L.pairs[to] = +chip.dataset.chip; L.pick = null; drawLesson(); }
      return;
    }
    const slot = e.target.closest('[data-slot]');
    if (slot && !L.checked) {
      const i = +slot.dataset.slot;
      if (L.pairs[i] != null) { L.pairs[i] = null; L.pick = i; } else L.pick = L.pick === i ? null : i;
      return drawLesson();
    }
    if (e.target.closest('button[data-check]')) return checkCurrent();
    if (e.target.closest('button[data-hint]')) { L.hint = true; return drawLesson(); }
    if (e.target.closest('button[data-self-ok]')) return markSelf();
  }

  // ---- карточки
  if (C) {
    const cd = e.target.closest('button[data-card]');
    if (cd && !C.checked) return answerCard(+cd.dataset.card === C.right, +cd.dataset.card);
    const self = e.target.closest('button[data-self]');
    if (self && !C.checked) return answerCard(self.dataset.self === '1', null);
    if (e.target.closest('button[data-cardcheck]')) return checkCard();
    if (e.target.closest('button[data-cardself]')) return markCardSelf();
  }

  const go = e.target.closest('button[data-go]');
  if (go) {
    const what = go.dataset.go;
    if (what === 'quiz') { L.step = 'quiz'; L.qi = 0; initQ(); return drawLesson(); }
    if (what === 'next') {
      if (L.qi + 1 < L.qs.length) { L.qi++; initQ(); } else L.step = 'result';
      return drawLesson();
    }
    if (what === 'finish') return finishLesson('done');
    if (what === 'card-next') return nextCard();
  }

  const art = e.target.closest('.art');
  if (!art) return;
  const id = art.dataset.id;
  if (e.target.closest('[data-open]') || e.target.closest('button[data-act="open"]')) return openLesson(id);
  const b = e.target.closest('button[data-act="dismissed"]');
  if (b) {
    art.classList.add('gone');
    try {
      const out = await fetch('/api/french/' + encodeURIComponent(id), {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ verdict: 'dismissed' }),
      }).then(async r => { if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status); return r.json(); });
      render(out.french);
      toast('Понял, такого больше не предлагаю');
      if (out.job === 'running') watchJob();
    } catch (err) { art.classList.remove('gone'); toast('Ошибка: ' + err.message); }
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

$('#level').addEventListener('change', async e => {
  try {
    await fetch('/api/french/level', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ level: e.target.value }) });
    toast('Уровень ' + e.target.value + ' — учту в следующем подборе');
  } catch { toast('Не сохранилось'); }
});

async function watchJob() {
  const before = DB && DB.updatedAt;
  for (let i = 0; i < 90; i++) {
    await new Promise(r => setTimeout(r, 5000));
    const db = await load();
    if (db && String(db.job || '').startsWith('error')) { toast('Не получилось: ' + String(db.job).slice(7, 140)); return; }
    if (db && db.job === 'done') { toast(db.updatedAt !== before ? 'Готово: новые материалы' : 'Готово'); return; }
  }
}

$('#refresh').addEventListener('click', async () => {
  const btn = $('#refresh');
  btn.disabled = true; btn.textContent = 'Ищу…';
  toast('Ищу видео и статьи и собираю разбор — пара минут');
  try { await fetch('/api/french/refresh', { method: 'POST' }); await watchJob(); }
  catch (e) { toast('Ошибка: ' + e.message); }
  btn.disabled = false; btn.textContent = 'Обновить';
});

load();
day();
</script>

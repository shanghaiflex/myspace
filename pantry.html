<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Еда</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥕</text></svg>">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --surface: #ffffff; --surface-2: #f2f2f4;
    --text: #1d1d1f; --text-2: #6e6e73; --text-3: #a1a1a6;
    --line: rgba(0,0,0,.08); --accent: #0071e3; --ok: #34c759; --warn: #ff9f0a; --bad: #ff3b30;
    --glass: rgba(250,250,250,.7);
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --surface: #1c1c1e; --surface-2: #2c2c2e;
      --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #6e6e73;
      --line: rgba(255,255,255,.1); --accent: #2997ff; --ok: #30d158; --warn: #ffd60a; --bad: #ff453a;
      --glass: rgba(0,0,0,.55);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Inter, system-ui, sans-serif;
    background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.45; letter-spacing: -0.01em; }
  a { color: inherit; text-decoration: none; }
  .bar { position: sticky; top: 0; z-index: 20; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
  .bar-inner { max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .nav { display: flex; gap: 18px; font-size: 17px; letter-spacing: -0.02em; }
  .nav a { color: var(--text-3); font-weight: 600; }
  .nav a.on { color: var(--text); }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 36px 32px 80px; }
  .head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
  .head h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; margin: 0; line-height: 1.1; }
  .head .sub { color: var(--text-2); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; }
  .card { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 22px; min-width: 0; grid-column: span 12; }
  .card.half { grid-column: span 6; }
  .card .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-2); font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .card .eyebrow .more { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--text-3); display: flex; gap: 10px; align-items: center; }
  .note { font-size: 20px; line-height: 1.4; letter-spacing: -0.02em; margin: 0; font-weight: 500; white-space: pre-wrap; }
  .empty { color: var(--text-2); font-size: 15px; }
  button.btn { font: inherit; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  button.btn:disabled { opacity: .5; cursor: default; }
  .stats { display: flex; gap: 26px; flex-wrap: wrap; color: var(--text-2); font-size: 13px; margin-top: 18px; }
  .stats b { color: var(--text); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; display: block; font-variant-numeric: tabular-nums; }
  .list { display: flex; flex-direction: column; }
  .row { display: flex; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .nm { font-weight: 600; letter-spacing: -0.015em; flex: 1; min-width: 0; }
  .row .why { color: var(--text-3); font-size: 13px; flex-basis: 100%; margin-top: -6px; padding-bottom: 4px; }
  .row .px { color: var(--text-2); font-variant-numeric: tabular-nums; font-size: 13.5px; white-space: nowrap; }
  .tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: -4px; padding: 4px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; white-space: nowrap; }
  th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 600; padding: 6px 10px 8px 0; border-bottom: 1px solid var(--line); }
  td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.n, th.n { text-align: right; padding-right: 18px; }
  td.dim { color: var(--text-3); }
  td.w { white-space: normal; min-width: 200px; }
  .foot { color: var(--text-3); font-size: 12.5px; margin-top: 14px; }
  .dishes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .dish { background: var(--surface-2); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--line); }
  .dish .pic { aspect-ratio: 4 / 3; background: var(--surface-2) center/cover no-repeat; display: block; }
  .dish .pic.none { display: flex; align-items: center; justify-content: center; font-size: 40px; opacity: .25; }
  .dish .body { padding: 15px 16px 16px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
  .dish h3 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; display: flex; gap: 8px; align-items: baseline; }
  .dish h3 .min { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--text-3); white-space: nowrap; }
  .dish .why { color: var(--text-2); font-size: 13.5px; line-height: 1.4; }
  .dish .ing { display: flex; flex-wrap: wrap; gap: 5px; }
  .dish .ing span { font-size: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; color: var(--text-2); }
  .dish ol { margin: 2px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--text); line-height: 1.5; }
  .dish ol li { margin-bottom: 3px; }
  .dish .cred { margin-top: auto; padding-top: 6px; font-size: 11px; color: var(--text-3); }
  .dish .cred a { text-decoration: underline; text-decoration-color: var(--line); }
  @media (max-width: 860px) { .card.half { grid-column: span 12; } }
  @media (max-width: 640px) {
    .bar-inner { padding: 12px 16px; } .nav { font-size: 15px; gap: 14px; }
    .wrap { padding: 24px 16px 70px; } .head h1 { font-size: 28px; } .card { padding: 18px; border-radius: 18px; }
    .note { font-size: 18px; }
  }
</style>
</head>
<body>
<header class="bar"><div class="bar-inner">
  <nav class="nav"><a href="index.html">Главная</a><a href="films.html">Фильмы</a><a href="books.html">Книги</a><a href="mixes.html">Миксы</a><a href="lectures.html">Лекции</a><a href="health.html">Well-being</a><a href="pantry.html" class="on">Еда</a></nav>
</div></header>

<main class="wrap">
  <div class="head"><h1>Еда</h1><div class="sub" id="fresh"></div></div>
  <div class="grid" id="grid"><div class="card"><div class="empty">Загружаю…</div></div></div>
</main>

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dt = s => s ? new Date(s) : null;
const fmtTs = s => { const d = dt(s); return d ? d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '—'; };
const ago = s => { const d = dt(s); if (!d) return 'данных ещё нет'; const m = Math.round((Date.now() - d) / 60000);
  return m < 2 ? 'только что' : m < 60 ? `${m} мин назад` : m < 1440 ? `${Math.round(m / 60)} ч назад` : `${Math.round(m / 1440)} дн назад`; };
const dayWord = n => { const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return 'дней'; if (b === 1) return 'день'; if (b > 1 && b < 5) return 'дня'; return 'дней'; };
const dmy = iso => new Date(iso + 'T12:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }).replace('.', '');

let busy = false;
async function load() {
  const r = await fetch('/api/pantry', { cache: 'no-store' });
  if (!r.ok) { document.getElementById('grid').innerHTML = `<div class="card"><div class="empty">Не удалось загрузить: ${r.status}</div></div>`; return; }
  const p = await r.json();
  const running = p.job === 'running';
  document.getElementById('fresh').textContent = p.stats && p.stats.last
    ? `последний чек ${dmy(p.stats.last)} · пересчитано ${ago(p.generated)}` : 'чеков пока нет';

  const cards = [];
  cards.push(`<div class="card"><div class="eyebrow">Заметка <span class="more">${p.note ? esc(fmtTs(p.note.ts)) + (p.note.model ? ' · ' + esc(p.note.model) : '') : ''}
      <button class="btn" id="run" ${running ? 'disabled' : ''}>${running ? 'Считаю…' : 'Обновить'}</button></span></div>
    ${p.note ? `<p class="note">${esc(p.note.text)}</p>` : `<div class="empty">Заметки пока нет — появится после первого прогона.</div>`}
    ${p.job && String(p.job).startsWith('error') ? `<div class="foot">Последний запуск: ${esc(p.job)}</div>` : ''}
    <div class="stats">
      <div><b>${p.proposal ? p.proposal.length : 0}</b>кончается по расчёту</div>
      <div><b>${p.stats && p.stats.receipts || 0}</b>чеков разобрано</div>
      <div><b>${p.stats && p.stats.products || 0}</b>товаров в модели</div>
    </div></div>`);

  cards.push(`<div class="card"><div class="eyebrow">Похоже, пора докупить</div>
    ${(p.proposal || []).length ? `<div class="list">${p.proposal.map(i => `
        <div class="row"><span class="nm">${esc(i.name)}</span><span class="px">~${Math.round(i.median_price)} ₽</span></div>
        <div class="why">${esc(i.why)}</div>`).join('')}</div>`
      : `<div class="empty">Всё на месте.</div>`}
    <div class="foot">Предложение появляется, только если товар покупался не меньше трёх раз и прошёл почти весь обычный цикл. Разовые покупки и сезонное сюда не попадают.</div></div>`);

  if (p.recipes && p.recipes.length) {
    cards.push(`<div class="card"><div class="eyebrow">Что приготовить
      <span class="more">${p.recipes_ts ? 'идеи от ' + esc(fmtTs(p.recipes_ts)) : ''}</span></div>
      <div class="dishes">${p.recipes.map(r => `
        <div class="dish">
          ${r.photo ? `<span class="pic" style="background-image:url('dishes/${esc(r.photo.file)}')"></span>`
                    : `<span class="pic none">🍳</span>`}
          <div class="body">
            <h3>${esc(r.title)}${r.time_min ? `<span class="min">${r.time_min} мин</span>` : ''}</h3>
            ${r.why ? `<div class="why">${esc(r.why)}</div>` : ''}
            <div class="ing">${(r.ingredients || []).map(i => `<span>${esc(i)}</span>`).join('')}</div>
            <ol>${(r.steps || []).map(t => `<li>${esc(t)}</li>`).join('')}</ol>
            ${r.photo ? `<div class="cred">фото — иллюстрация, не снимок этого блюда:
              <a href="${esc(r.photo.page)}" target="_blank" rel="noopener">Wikimedia Commons</a>${r.photo.credit ? ', ' + esc(r.photo.credit) : ''}${r.photo.license ? ', ' + esc(r.photo.license) : ''}</div>` : ''}
          </div>
        </div>`).join('')}</div>
      <div class="foot">Идеи собраны по тому, что ты покупаешь регулярно, и обновляются раз в несколько дней.</div></div>`);
  }

  if (p.recent && p.recent.length) {
    cards.push(`<div class="card"><div class="eyebrow">Куплено за последние три недели</div><div class="tbl"><table>
      <tr><th>Товар</th><th>Категория</th><th class="n">Куплено</th><th class="n">Цикл</th><th class="n">Осталось</th></tr>
      ${p.recent.map(i => `<tr>
        <td class="w">${esc(i.name)}</td><td class="dim">${esc(i.category)}</td>
        <td class="n">${dmy(i.last_bought)}<span class="dim"> · ${i.days_since} ${dayWord(i.days_since)}</span></td>
        <td class="n ${i.cadence_days ? '' : 'dim'}">${i.cadence_days ? Math.round(i.cadence_days) + ' дн' : '—'}</td>
        <td class="n ${i.est_left ? '' : 'dim'}">${i.est_left ? Math.round(i.est_left) + (i.unit || '') : '—'}</td></tr>`).join('')}
      </table></div>
      <div class="foot">«Осталось» — оценка: сколько куплено минус средний расход, выведенный из того, как часто товар перекупается. Никто не знает, что съедено на самом деле.</div></div>`);
  }

  document.getElementById('grid').innerHTML = cards.join('');
  const btn = document.getElementById('run');
  if (btn) btn.onclick = async () => {
    btn.disabled = true; btn.textContent = 'Считаю…';
    await fetch('/api/pantry/review', { method: 'POST' }).catch(() => {});
    busy = true; setTimeout(load, 4000);
  };
  if (running || busy) { busy = running; setTimeout(load, 5000); }
}
load();
</script>
</body>
</html>
